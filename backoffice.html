<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Cigar Locator — Backoffice</title>

  <!-- Styles -->
  <link rel="stylesheet" href="css/backoffice.css" />

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- ============================================================
       LOGIN SCREEN
       ============================================================ -->

  <div id="login-screen" class="login-screen">
    <div class="login-box">
      <h2>Backoffice Login</h2>
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <button id="login-btn" class="btn blue">Login</button>
      <div id="login-error" class="error"></div>
    </div>
  </div>

  <!-- ============================================================
       MAIN APPLICATION
       ============================================================ -->

  <div class="wrap" style="display:none">

    <!-- ============================================================
         ENTERPRISE TOPBAR
         ============================================================ -->

    <div class="topbar">
      <div class="brand">
        <div class="title">World Cigar Locator</div>
        <div class="sub">Backoffice</div>
      </div>

      <div class="actions">
        <button class="btn blue" onclick="location.href='add-store-backoffice.html'">
          Add Store
        </button>

        <button class="btn ghost" onclick="location.href='analytics.html'">
          Analytics
        </button>

        <button class="btn green" onclick="reloadData()">
          Reload
        </button>
      </div>

      <div class="admin">
        <span class="admin-label">Admin</span>
        <button class="btn ghost small" onclick="logout()">Logout</button>
      </div>
    </div>

    <!-- ============================================================
         FILTER BAR
         ============================================================ -->

    <div class="filters">
      <div class="pill" data-tab="pending">Pending</div>
      <div class="pill" data-tab="approved">Approved</div>
      <div class="pill" data-tab="flagged">Flagged</div>
      <div class="pill" data-tab="deleted">Deleted</div>
      <div class="pill" data-tab="all">All</div>
    </div>

    <!-- ============================================================
         VIEW TOGGLE
         ============================================================ -->

    <div class="viewtoggle">
      <div class="seg active" data-view="cards">Cards</div>
      <div class="seg" data-view="list">List</div>
    </div>

    <!-- ============================================================
         SEARCH BAR
         ============================================================ -->

    <div class="searchbar">
      <input id="searchInput" type="text" placeholder="Search by ID, name, city or country" />
    </div>

    <!-- ============================================================
         CONTENT AREA
         ============================================================ -->

    <div id="cards" class="cards-grid"></div>
    <div class="listview-wrap" style="display:none"></div>

  </div>

  <!-- ============================================================
       TOAST CONTAINER
       ============================================================ -->

  <div id="toast-container" class="toast-container"></div>

  <!-- ============================================================
       SCRIPTS
       ============================================================ -->

  <script src="backoffice.js"></script>

</body>
</html>
