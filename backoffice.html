<!DOCTYPE html>
<html lang="en">

<head>
  <!-- ============================================================
       META
       ============================================================ -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Backoffice — World Cigar Locator</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/backoffice.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
</head>

<body>

  <!-- ============================================================
       LOGIN SCREEN
       ============================================================ -->
  <div id="login-screen" class="login-screen" style="display:none">
    <div class="login-card">
      <h2>World Cigar Locator — Backoffice</h2>
      <input id="email" type="email" placeholder="Email" autocomplete="username" />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
      <button id="login-btn">Login</button>
      <p id="login-error" class="error"></p>
    </div>
  </div>

  <!-- ============================================================
       MAIN WRAPPER
       ============================================================ -->
  <div class="wrap" style="display:none">

    <!-- ============================================================
         PREMIUM TOPBAR
         ============================================================ -->
<div class="topbar">

  <div class="left-block">
    <img 
      src="images/wcl_brand_text_no_url.png"
      alt="World Cigar Locator"
      class="backoffice-brand"
    />
  </div>

  <div class="actions">
    <button class="btn blue" onclick="location.href='add-store-backoffice.html'">
      ＋ Add Store
    </button>

    <button class="btn ghost" onclick="location.href='analytics.html'">
      📊 Analytics
    </button>

    <button class="btn green" onclick="reloadData()">
      ⟲ Reload
    </button>
  </div>

</div>

    <!-- ============================================================
         FILTER TABS
         ============================================================ -->
 <div class="filters">
  <button class="pill active" data-tab="approved">Approved</button>
  <button class="pill" data-tab="pending">Pending</button>
  <button class="pill orange" data-tab="reports">Reports</button>
  <button class="pill" data-tab="duplicates">Duplicates</button>
  <button class="pill" data-tab="flagged">Flagged</button>
  <button class="pill" data-tab="deleted">Trash</button>
</div>

    <!-- ============================================================
         SEARCH + VIEW TOGGLE
         ============================================================ -->
    <div class="searchbar">
      <input id="searchInput" placeholder="Search by name, city, country…" />
      <div class="viewtoggle">
        <span class="seg active" data-view="cards">Cards</span>
        <span class="seg" data-view="list">List</span>
      </div>
    </div>

    <!-- ============================================================
         CARD VIEW
         ============================================================ -->
    <div id="cards" class="grid"></div>

    <!-- ============================================================
         LIST VIEW
         ============================================================ -->
    <div class="listview-wrap" style="display:none;">

      <div class="hierarchy-header">
        <button id="expandAll" class="btn ghost small">Expand All</button>
        <button id="collapseAll" class="btn ghost small">Collapse All</button>
      </div>

      <div id="hierarchyPanel"></div>

      <div id="table" class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Country</th>
              <th>State</th>
              <th>City</th>
              <th>Continent</th>
              <th>Type</th>
              <th>Access</th>
              <th>Rating</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

    </div>
  </div>

  <!-- Toast -->
  <div id="toast-container"></div>

  <!-- Main Script -->
  <script src="js/backoffice.js"></script>

</body>
</html>
