<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Backoffice — Moderation (V5 Proxy Ready)</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/backoffice.css" />

  <!-- Inter font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="wrap">
    <h1 class="page-title">Backoffice</h1>

    <!-- Topbar -->
    <div class="topbar">
      <button class="btn" onclick="location.href='add-store-backoffice.html'">Add Store</button>
      <button class="btn ghost" onclick="location.href='analytics.html'">Analytics</button>

      <div class="spacer"></div>

      <div class="tabs">
        <button class="tab active" data-tab="all">All</button>
        <button class="tab" data-tab="approved">Approved</button>
        <button class="tab" data-tab="pending">Pending</button>
        <button class="tab" data-tab="flagged">Flagged</button>
        <button class="tab" data-tab="deleted">Trash</button>
      </div>

      <button class="btn ghost" id="reloadBtn">Reload</button>
    </div>

    <!-- Search + View toggle -->
    <div class="searchbar">
      <input id="searchInput" placeholder="Search by name, city, country…" />
      <button class="btn ghost" id="searchBtn">Search</button>
      <button class="btn ghost" id="clearBtn">Clear</button>

      <div class="viewtoggle">
        <span class="seg active" data-view="cards">Cards</span>
        <span class="seg" data-view="list">List</span>
      </div>
    </div>

    <!-- Counts line -->
    <div id="countLine" class="count-line"></div>

    <!-- Cards view -->
    <div id="cards" class="grid"></div>

    <!-- List view: hierarchy -->
    <div id="hierarchyPanel" class="hierarchy-panel" style="display:none;">
      <div class="h-row">
        <div class="crumbs" id="hCrumbs">Showing: <b>All</b></div>
        <div class="h-controls">
          <button class="btn ghost" id="hCloseAll">Close All</button>
        </div>
      </div>
      <div id="hTree" class="h-tree"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast-container"></div>

  <!-- Flag modal -->
  <div id="flagModal" class="modal-backdrop">
    <div class="modal">
      <h3>Flag store — reason</h3>
      <textarea id="flagReason" placeholder="Describe why this store should be flagged…"></textarea>
      <div class="row">
        <button class="btn ghost" id="flagCancel">Cancel</button>
        <button class="btn danger" id="flagConfirm">Flag</button>
      </div>
    </div>
  </div>

  <!-- Edit modal -->
  <div id="editModal" class="modal-backdrop">
    <div class="modal wide">
      <h3>Edit store</h3>

      <div class="edit-grid">
        <label>Name <input id="e_name" /></label>
        <label>Phone <input id="e_phone" /></label>
        <label class="full">Address <input id="e_address" /></label>
        <label>City <input id="e_city" /></label>
        <label>Country <input id="e_country" /></label>
        <label>Continent
          <select id="e_continent">
            <option>Europe</option>
            <option>North America</option>
            <option>South America</option>
            <option>Asia</option>
            <option>Africa</option>
            <option>Oceania</option>
            <option>Other</option>
          </select>
        </label>
        <label class="full">Website <input id="e_website" placeholder="https://"/></label>

        <div class="chip-group full">
          <div class="chip-toggle">
            <input type="checkbox" id="e_type_store" /><label for="e_type_store">store</label>
            <input type="checkbox" id="e_type_lounge" /><label for="e_type_lounge">lounge</label>
          </div>
          <div class="chip-toggle">
            <input type="radio" name="e_access" id="e_access_public" value="public"/><label for="e_access_public">Public</label>
            <input type="radio" name="e_access" id="e_access_members" value="members"/><label for="e_access_members">Members Only</label>
          </div>
        </div>

        <div class="status-row full">
          <span id="e_badge_pending" class="badge gold">PENDING</span>
          <span id="e_badge_approved" class="badge green">APPROVED</span>
          <span id="e_badge_flagged" class="badge red">FLAGGED</span>
          <span id="e_badge_deleted" class="badge gray">DELETED</span>
        </div>
      </div>

      <div class="reviews full">
        <h4>Recent comments</h4>
        <div id="reviewsList" class="reviews-list"></div>
      </div>

      <div class="row end">
        <button class="btn ghost" id="editCancel">Close</button>
        <button class="btn" id="editSave">Save</button>
      </div>
    </div>
  </div>

  <script src="js/backoffice.js"></script>
</body>
</html>
