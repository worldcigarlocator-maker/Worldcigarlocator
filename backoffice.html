<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Backoffice — Moderation V5.2</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/backoffice.css" />
</head>
<body>
  <div class="wrap">
    <!-- Topbar -->
    <div class="topbar">
      <button class="btn primary" onclick="location.href='add-store-backoffice.html'">＋ Add Store</button>
      <button class="btn ghost" onclick="location.href='analytics.html'">📊 Analytics</button>
      <button class="btn ghost" onclick="reloadData()">⟲ Reload</button>
    </div>

    <!-- Filters -->
    <div class="filters">
      <button class="pill active" data-tab="all">All</button>
      <button class="pill" data-tab="approved">Approved</button>
      <button class="pill" data-tab="pending">Pending</button>
      <button class="pill" data-tab="flagged">Flagged</button>
      <button class="pill" data-tab="deleted">Trash</button>
    </div>

    <!-- Search + View Toggle -->
    <div class="searchbar">
      <input id="searchInput" placeholder="Search by name, city, country…" />
      <div class="viewtoggle">
        <span class="seg active" data-view="cards">Cards</span>
        <span class="seg" data-view="list">List</span>
      </div>
    </div>

    <!-- Card grid -->
    <div id="cards" class="grid"></div>

    <!-- List table -->
    <div id="table" class="table-wrap" style="display:none">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Country</th>
            <th>City</th>
            <th>Continent</th>
            <th>Type</th>
            <th>Access</th>
            <th>Rating</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="toast-container"></div>

  <script>
    // ============================================================
    // CONFIG
    // ============================================================
    const WCL = {};
    WCL.SUPABASE_URL = "https://gbxxoeplkzbhsvagnfsr.supabase.co";
    WCL.SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdieHhvZXBsa3piaHN2YWduZnNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2NjQ1MDAsImV4cCI6MjA3MzI0MDUwMH0.E4Vk-GyLe22vyyfRy05hZtf4t5w_Bd_B-tkEFZ1alT4";
    WCL.PHOTO_PROXY_URL = "https://gbxxoeplkzbhsvagnfsr.functions.supabase.co/photo-proxy";
    WCL.FALLBACK_IMG = "https://worldcigarlocator-maker.github.io/Worldcigarlocator/images/store.jpg";
    WCL.supabase = window.supabase.createClient(WCL.SUPABASE_URL, WCL.SUPABASE_ANON_KEY);

    let currentTab = "all";
    let currentView = "cards";
    let STORES = [];

    const toast = (msg, cls="success") => {
      const c = document.getElementById("toast-container");
      const t = document.createElement("div");
      t.className = `toast ${cls}`;
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    };

    // ============================================================
    // LOAD STORES
    // ============================================================
    async function reloadData() {
      const grid = document.getElementById("cards");
      grid.innerHTML = "<p style='color:#888;text-align:center;'>Loading…</p>";

      let query = WCL.supabase.from("stores").select("*").order("id", { ascending: false });

      switch (currentTab) {
        case "approved":
          query = query.eq("approved", true).eq("deleted", false);
          break;
        case "pending":
          query = query.eq("approved", false).eq("deleted", false).eq("flagged", false);
          break;
        case "flagged":
          query = query.eq("flagged", true).eq("deleted", false);
          break;
        case "deleted":
          query = query.eq("deleted", true);
          break;
        case "all":
        default:
          query = query.eq("deleted", false);
      }

      const { data, error } = await query;
      if (error) {
        console.error(error);
        grid.innerHTML = `<p class='error'>Error loading stores<br>${error.message}</p>`;
        return;
      }

      STORES = data;
      renderView();
    }

    // ============================================================
    // RENDER VIEW
    // ============================================================
    function renderView() {
      const grid = document.getElementById("cards");
      const table = document.getElementById("table");

      if (currentView === "cards") {
        grid.style.display = "grid";
        table.style.display = "none";
        renderCards();
      } else {
        grid.style.display = "none";
        table.style.display = "block";
        renderList();
      }
    }

    // ============================================================
    // RENDER CARDS
    // ============================================================
    function renderCards() {
      const grid = document.getElementById("cards");
      grid.innerHTML = "";

      if (!STORES.length) {
        grid.innerHTML = "<p style='color:#888;text-align:center;'>No stores found.</p>";
        return;
      }

      STORES.forEach((s) => {
        const card = document.createElement("div");
        card.className = "store-card";

        let colorClass = s.deleted
          ? "deleted"
          : s.flagged
          ? "flagged"
          : s.approved
          ? "approved"
          : "pending";
        card.classList.add(colorClass);

        const imgSrc = s.photo_reference
          ? `${WCL.PHOTO_PROXY_URL}?photo_reference=${encodeURIComponent(s.photo_reference)}&maxwidth=800`
          : WCL.FALLBACK_IMG;

        card.innerHTML = `
          <img src="${imgSrc}" class="store-photo" onerror="this.src='${WCL.FALLBACK_IMG}'">
          <div class="store-body">
            <h3>${s.name || "Unnamed"}</h3>
            <p>${s.city || "Unknown"}, ${s.country || ""}</p>
            <p><small>${s.continent || ""}</small></p>
            <div class="stars">${s.rating ? "★".repeat(s.rating) + "☆".repeat(5 - s.rating) : ""}</div>
            <p class="meta">${s.type || "Store"} • ${s.access || "Public"}</p>
            <span class="status">${colorClass.toUpperCase()}</span>
          </div>
          <div class="actions">
            <button class="btn small approve" onclick="approve(${s.id})">Approve</button>
            <button class="btn small flag" onclick="flag(${s.id})">Flag</button>
            <button class="btn small delete" onclick="removeStore(${s.id})">Delete</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // ============================================================
    // RENDER LIST
    // ============================================================
    function renderList() {
      const tbody = document.getElementById("tbody");
      tbody.innerHTML = "";

      if (!STORES.length) {
        tbody.innerHTML = "<tr><td colspan='8' style='text-align:center;'>No stores found</td></tr>";
        return;
      }

      STORES.forEach((s) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${s.name}</td>
          <td>${s.country}</td>
          <td>${s.city}</td>
          <td>${s.continent || "-"}</td>
          <td>${s.type || "-"}</td>
          <td>${s.access || "-"}</td>
          <td>${s.rating || "-"}</td>
          <td>${s.approved ? "Approved" : s.flagged ? "Flagged" : s.deleted ? "Deleted" : "Pending"}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // ============================================================
    // ACTIONS
    // ============================================================
    async function approve(id) {
      const { error } = await WCL.supabase.from("stores").update({ approved:true, flagged:false }).eq("id", id);
      if (error) return toast("Error approving", "error");
      toast("✅ Approved");
      reloadData();
    }

    async function flag(id) {
      const reason = prompt("Reason for flagging?");
      if (!reason) return;
      const { error } = await WCL.supabase.from("stores").update({ flagged:true, flag_reason:reason }).eq("id", id);
      if (error) return toast("Error flagging", "error");
      toast("🚩 Flagged");
      reloadData();
    }

    async function removeStore(id) {
      if (!confirm("Move this store to Trash?")) return;
      const { error } = await WCL.supabase.from("stores").update({ deleted:true }).eq("id", id);
      if (error) return toast("Error deleting", "error");
      toast("🗑️ Moved to Trash");
      reloadData();
    }

    // ============================================================
    // FILTERS + VIEW TOGGLE + SEARCH
    // ============================================================
    document.querySelectorAll(".pill").forEach((p) => {
      p.addEventListener("click", () => {
        document.querySelectorAll(".pill").forEach((b) => b.classList.remove("active"));
        p.classList.add("active");
        currentTab = p.dataset.tab;
        reloadData();
      });
    });

    document.querySelectorAll(".seg").forEach((seg) => {
      seg.addEventListener("click", () => {
        document.querySelectorAll(".seg").forEach((s) => s.classList.remove("active"));
        seg.classList.add("active");
        currentView = seg.dataset.view;
        renderView();
      });
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      const term = e.target.value.trim().toLowerCase();
      if (!term) return renderView();
      const filtered = STORES.filter((s) =>
        [s.name, s.city, s.country].some((f) => f?.toLowerCase().includes(term))
      );
      if (currentView === "cards") renderCards(filtered);
      else renderList(filtered);
    });

    document.addEventListener("DOMContentLoaded", reloadData);
  </script>
</body>
</html>
