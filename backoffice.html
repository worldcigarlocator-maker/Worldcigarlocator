<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Backoffice — Moderation (V5.5 Inline Edit)</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/backoffice.css" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="wrap">
    <!-- Topbar -->
    <div class="topbar">
      <button class="btn primary" onclick="location.href='add-store-backoffice.html'">＋ Add Store</button>
      <button class="btn ghost" onclick="location.href='analytics.html'">📊 Analytics</button>
      <button class="btn ghost" onclick="reloadData()">⟲ Reload</button>
    </div>

    <!-- Filters -->
    <div class="filters">
      <button class="pill" data-tab="all">All</button>
      <button class="pill" data-tab="approved">Approved</button>
      <button class="pill active" data-tab="pending">Pending</button>
      <button class="pill" data-tab="flagged">Flagged</button>
      <button class="pill" data-tab="deleted">Trash</button>
    </div>

    <div class="searchbar">
      <input id="searchInput" placeholder="Search by name, city, country…" />
      <div class="viewtoggle">
        <span class="seg" data-view="list">List</span>
        <span class="seg active" data-view="cards">Cards</span>
      </div>
    </div>

    <!-- Dynamic containers -->
    <div id="cards" class="grid"></div>
    <div id="table" class="table-wrap" style="display:none">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>City</th>
            <th>Country</th>
            <th>Continent</th>
            <th>Type</th>
            <th>Access</th>
            <th>Rating</th>
            <th>Comments</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <script>
    // ============================================================
    // Global Config
    // ============================================================
    const WCL = {};
    WCL.SUPABASE_URL = "https://gbxxoeplkzbhsvagnfsr.supabase.co";
    WCL.SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdieHhvZXBsa3piaHN2YWduZnNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2NjQ1MDAsImV4cCI6MjA3MzI0MDUwMH0.E4Vk-GyLe22vyyfRy05hZtf4t5w_Bd_B-tkEFZ1alT4";
    WCL.supabase = window.supabase.createClient(WCL.SUPABASE_URL, WCL.SUPABASE_ANON_KEY);
    WCL.PHOTO_PROXY_URL = "https://gbxxoeplkzbhsvagnfsr.functions.supabase.co/photo-proxy";
    WCL.FALLBACK_IMG = "https://worldcigarlocator-maker.github.io/Worldcigarlocator/images/store.jpg";

    let STORES = [];
    let currentTab = "pending";

    // ============================================================
    // Load stores
    // ============================================================
    async function reloadData(tab = currentTab) {
      currentTab = tab;
      const grid = document.getElementById("cards");
      grid.innerHTML = "<p style='color:#999;text-align:center;'>Loading…</p>";

      let query = WCL.supabase.from("stores").select("*").order("id", { ascending: false });

      if (tab === "pending") query = query.eq("approved", false).eq("flagged", false).eq("deleted", false);
      if (tab === "approved") query = query.eq("approved", true).eq("deleted", false);
      if (tab === "flagged") query = query.eq("flagged", true).eq("deleted", false);
      if (tab === "deleted") query = query.eq("deleted", true);

      const { data, error } = await query;
      if (error) {
        console.error(error);
        grid.innerHTML = "<p style='color:#c33;text-align:center;'>Error loading stores</p>";
        return;
      }

      STORES = data || [];
      renderCards();
    }

    // ============================================================
    // Render Cards (Inline Editable)
    // ============================================================
    function renderCards() {
      const grid = document.getElementById("cards");
      grid.innerHTML = "";

      if (!STORES.length) {
        grid.innerHTML = "<p style='color:#888;text-align:center;'>No stores found.</p>";
        return;
      }

      STORES.forEach((s) => {
        const card = document.createElement("div");
        card.className = "store-card";

        let colorClass = s.deleted
          ? "deleted"
          : s.flagged
          ? "flagged"
          : s.approved
          ? "approved"
          : "pending";
        card.classList.add(colorClass);

        const imgSrc = s.photo_reference
          ? `${WCL.PHOTO_PROXY_URL}?photo_reference=${encodeURIComponent(s.photo_reference)}&maxwidth=800`
          : WCL.FALLBACK_IMG;

        card.innerHTML = `
          <img src="${imgSrc}" class="store-photo" onerror="this.src='${WCL.FALLBACK_IMG}'">
          <div class="store-body" data-id="${s.id}">
            <h3 data-field="name" class="editable">${s.name || "Unnamed"}</h3>
            <p>
              <span data-field="city" class="editable">${s.city || "Unknown"}</span>,
              <span data-field="country" class="editable">${s.country || ""}</span>
            </p>
            <p><small data-field="continent" class="editable">${s.continent || ""}</small></p>
            <p>⭐ ${s.rating ?? "–"}</p>
            <p class="meta">
              <span data-field="type" class="editable">${s.type || "Store"}</span> •
              <span data-field="access" class="editable">${s.access || "Public"}</span>
            </p>
            ${
              s.comment
                ? `<p class="comment"><strong>💬</strong> ${s.comment}</p>`
                : `<p class="comment empty">No comments yet</p>`
            }
            <span class="status">${colorClass.toUpperCase()}</span>
          </div>
          <div class="actions">
            ${
              s.flagged
                ? `<button class="btn small unflag" onclick="unflag(${s.id})">🚩 Unflag</button>`
                : `<button class="btn small flag" onclick="flag(${s.id})">Flag</button>`
            }
            ${
              s.deleted
                ? `<button class="btn small undelete" onclick="undelete(${s.id})">↩️ Restore</button>`
                : `<button class="btn small delete" onclick="removeStore(${s.id})">Delete</button>`
            }
            <button class="btn small approve" onclick="approve(${s.id})">Approve</button>
          </div>
        `;
        grid.appendChild(card);
      });

      document.querySelectorAll(".editable").forEach((el) => {
        el.addEventListener("dblclick", () => startInlineEdit(el));
      });
    }

    // ============================================================
    // Inline Edit Logic
    // ============================================================
    function startInlineEdit(el) {
      const field = el.dataset.field;
      const id = el.closest(".store-body").dataset.id;
      const original = el.textContent.trim();
      const input = document.createElement("input");
      input.value = original;
      input.className = "inline-input";
      el.replaceWith(input);
      input.focus();

      input.addEventListener("keydown", async (e) => {
        if (e.key === "Escape") {
          input.replaceWith(el);
          el.textContent = original;
        }
        if (e.key === "Enter") {
          const newValue = input.value.trim();
          await saveInlineEdit(id, field, newValue, el, input);
        }
      });

      input.addEventListener("blur", async () => {
        const newValue = input.value.trim();
        if (newValue !== original) await saveInlineEdit(id, field, newValue, el, input);
        else input.replaceWith(el);
      });
    }

    async function saveInlineEdit(id, field, value, el, input) {
      const { error } = await WCL.supabase.from("stores").update({ [field]: value }).eq("id", id);
      if (error) {
        toast("Error saving", "error");
        input.replaceWith(el);
        el.textContent = el.textContent;
        return;
      }
      el.textContent = value;
      input.replaceWith(el);
      toast(`✅ ${field} updated`);
    }

    // ============================================================
    // Moderation Actions
    // ============================================================
    async function approve(id) {
      await WCL.supabase.from("stores").update({ approved: true }).eq("id", id);
      toast("Approved ✅");
      reloadData();
    }
    async function flag(id) {
      const reason = prompt("Enter reason:");
      if (!reason) return;
      await WCL.supabase.from("stores").update({ flagged: true, flag_reason: reason }).eq("id", id);
      toast("Flagged 🚩");
      reloadData();
    }
    async function unflag(id) {
      await WCL.supabase.from("stores").update({ flagged: false, flag_reason: null }).eq("id", id);
      toast("Unflagged 🚩");
      reloadData();
    }
    async function removeStore(id) {
      await WCL.supabase.from("stores").update({ deleted: true }).eq("id", id);
      toast("Moved to Trash 🗑️");
      reloadData();
    }
    async function undelete(id) {
      await WCL.supabase.from("stores").update({ deleted: false }).eq("id", id);
      toast("Restored ♻️");
      reloadData();
    }

    // ============================================================
    // UI Events
    // ============================================================
    document.querySelectorAll(".pill").forEach((p) => {
      p.addEventListener("click", () => {
        document.querySelectorAll(".pill").forEach((b) => b.classList.remove("active"));
        p.classList.add("active");
        reloadData(p.dataset.tab);
      });
    });

    document.getElementById("searchInput").addEventListener("input", async (e) => {
      const term = e.target.value.trim();
      if (!term) return reloadData();
      const { data, error } = await WCL.supabase
        .from("stores")
        .select("*")
        .ilike("name", `%${term}%`);
      if (error) return console.error(error);
      STORES = data || [];
      renderCards();
    });

    function toast(msg, cls = "success") {
      const c = document.getElementById("toast-container");
      const t = document.createElement("div");
      t.className = `toast ${cls}`;
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }

    document.addEventListener("DOMContentLoaded", () => {
      reloadData("pending");
      toast("✅ Inline Edit Active");
    });
  </script>
</body>
</html>
