<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Store — World Cigar Locator</title>

  <!-- ============================================================
       SUPABASE
  ============================================================ -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ============================================================
       WCL CSS
  ============================================================ -->

  <link rel="stylesheet" href="css/core/variables.css">
  <link rel="stylesheet" href="css/start.css">
  <link rel="stylesheet" href="css/search.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/pages/add.css">

</head>

<body class="add-page">

  <!-- ============================================================
       MAIN WRAPPER
  ============================================================ -->

<div class="wrap">

  <div class="page-header">

    <div class="header-left">
      <h1>Add Listing</h1>
      <button id="saveBtn" class="btn-primary">
        Save
      </button>
    </div>

    <button class="btn-ghost header-back"
            onclick="window.location.href='index.html'">
      Back to Home
    </button>

  </div>

  <div class="grid">

  <!-- Google Autocomplete -->
  <div class="full">
    <label>Search with Google</label>
    <input id="gAddress" type="text" placeholder="Start typing a place..." />
  </div>

 <!-- Basic Info -->

<div>
  <label data-i18n="name">
    Name
  </label>

  <input id="name" type="text">
</div>

<div>
  <label data-i18n="phone">
    Phone
  </label>

  <input id="phone" type="tel">
</div>

<div class="full">
  <label data-i18n="address">
    Address
  </label>

  <input id="addr" type="text">
</div>

<div>
  <label data-i18n="city">
    City
  </label>

  <input
    id="city"
    type="text"
    list="city-list"
    autocomplete="off"
  >

  <datalist id="city-list"></datalist>
</div>

<div>
  <label data-i18n="state_region">
    State / Region
  </label>

  <input
    id="state"
    type="text"
    placeholder="Auto (can be edited)"
  >
</div>

<div>
  <label data-i18n="country">
    Country
  </label>

  <input id="country" type="text">
</div>

<div>
  <label data-i18n="website">
    Website
  </label>

  <input id="website" type="url">
</div>

<!-- Pills -->

<div class="full">

  <div class="pill-row">

    <label class="pill">
      <input type="checkbox" value="store">

      <span data-i18n="store">
        Store
      </span>
    </label>

    <label class="pill">
      <input type="checkbox" value="lounge">

      <span data-i18n="lounge">
        Lounge
      </span>
    </label>

    <label class="pill">
      <input
        type="radio"
        name="access"
        value="public"
      >

      <span data-i18n="public">
        Public
      </span>
    </label>

    <label class="pill">
      <input
        type="radio"
        name="access"
        value="members"
      >

      <span data-i18n="members_only">
        Members Only
      </span>
    </label>

  </div>

</div>

<!-- Comment -->

<div class="full">

  <label data-i18n="comment">
    Comment
  </label>

  <textarea id="comment"></textarea>

</div>

<!-- Photo -->

<div class="full">

  <label data-i18n="photo_preview">
    Photo Preview
  </label>

  <div class="photo-picker">

    <button
      id="prev-photo"
      class="photo-nav"
    >
      ◀
    </button>

    <img
      id="preview-photo"
      class="preview-photo"
      src="https://worldcigarlocator-maker.github.io/Worldcigarlocator/images/store.jpg"
    >

    <button
      id="next-photo"
      class="photo-nav"
    >
      ▶
    </button>

  </div>

  <div
    id="photo-meta"
    style="text-align:center;margin-top:.4rem;"
    data-i18n="no_photo_loaded"
  >
    No photo loaded
  </div>

</div>

</div>

</div>

<!-- Toast -->

  <div id="toast-container"></div>

  <!-- ============================================================
       JS
  ============================================================ -->

<script type="module">

  import {
    initI18n
  } from "/js/i18n.js";

  await initI18n();

</script>
  
  <script src="js/add-shared.js"></script>

  <script src="js/add-store.js"></script>

  <!-- Google Places -->

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDdn7E6_dfwUjGQ1IUdJ2rQXUeEYIIzVtQ&libraries=places&callback=initAutocomplete&language=en" async defer></script>

</body>
</html>
