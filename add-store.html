<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Store — World Cigar Locator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/start.css">
  <link rel="stylesheet" href="css/search.css">
  <link rel="stylesheet" href="css/cards.css">

  <style>
    .add-wrap {
      max-width: 800px;
      margin: 3rem auto;
      padding: 2rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .add-wrap h1 {
      margin-bottom: 1.5rem;
      font-size: 1.6rem;
    }

    .add-wrap label {
      font-weight: 600;
      margin-bottom: .4rem;
      display: block;
    }

    .add-wrap input,
    .add-wrap textarea {
      width: 100%;
      padding: .6rem .8rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #111;
      color: white;
    }

    .add-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 1.5rem;
    }

    .btn-primary {
      background: rgb(var(--global));
      color: white;
      border: none;
      padding: .6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: white;
      padding: .6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="add-wrap">
    <h1>Add a Store</h1>

    <label>Search with Google</label>
    <input id="gAddress" type="text" placeholder="Start typing a place..." />

    <label>Name</label>
    <input id="name" type="text" />

    <label>Phone</label>
    <input id="phone" type="tel" />

    <label>Address</label>
    <input id="addr" type="text" />

    <label>City</label>
    <input id="city" type="text" />

    <label>State / Region</label>
    <input id="state" type="text" />

    <label>Country</label>
    <input id="country" type="text" />

    <label>Website</label>
    <input id="website" type="url" placeholder="https://"/>

    <label>Comment</label>
    <textarea id="comment"></textarea>

    <div class="add-actions">
      <button class="btn-ghost" onclick="window.location.href='index.html'">
        Back to Home
      </button>
      <button id="saveBtn" class="btn-primary">
        Save
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/add-shared.js"></script>
  <script src="js/add-store.js"></script>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDdn7E6_dfwUjGQ1IUdJ2rQXUeEYIIzVtQ&libraries=places&callback=initAutocomplete&language=en" async defer></script>

</body>
</html>
