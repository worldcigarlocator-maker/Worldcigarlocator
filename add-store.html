<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Store — World Cigar Locator</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Frontend CSS -->
  <link rel="stylesheet" href="css/start.css">
  <link rel="stylesheet" href="css/search.css">
  <link rel="stylesheet" href="css/cards.css">

  <style>
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      margin: 0;
      padding: 2rem 1rem;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
    }

    h1 {
      margin-bottom: 1.5rem;
      font-size: 1.6rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .8rem 1.2rem;
    }

    .full { grid-column: 1 / -1; }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: .3rem;
    }

    input, textarea {
      width: 100%;
      padding: .55rem .7rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f0f0f;
      color: white;
    }

    textarea { min-height: 70px; resize: vertical; }

    .type-group, .access-group {
      display: flex;
      gap: .6rem;
      flex-wrap: wrap;
      margin-top: .3rem;
    }

    .type-btn, .access-pill span {
      border: 1px solid rgb(var(--global));
      border-radius: 999px;
      padding: .35rem .9rem;
      cursor: pointer;
      font-weight: 600;
      transition: .2s ease;
    }

    .type-btn { color: rgb(var(--global)); }
    .type-btn.active {
      background: rgb(var(--global));
      color: white;
    }

    .access-pill input { display: none; }
    .access-pill span { color: rgb(var(--global)); }
    .access-pill input:checked + span {
      background: rgb(var(--global));
      color: white;
    }

    .photo-picker {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      margin-top: .5rem;
    }

    .photo-nav {
      border: 1px solid var(--border);
      background: transparent;
      color: white;
      border-radius: 6px;
      padding: .3rem .7rem;
      cursor: pointer;
    }

    .preview-photo {
      width: 220px;
      height: 140px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .actions {
      display: flex;
      justify-content: space-between;
      margin-top: 2rem;
    }

    .btn-primary {
      background: rgb(var(--global));
      border: none;
      color: white;
      padding: .6rem 1.3rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: white;
      padding: .6rem 1.3rem;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="wrap">
    <h1>Add a Store</h1>

    <div class="grid">

      <div class="full">
        <label>Search with Google</label>
        <input id="gAddress" type="text" placeholder="Start typing a place..." />
      </div>

      <div><label>Name</label><input id="name" type="text"></div>
      <div><label>Phone</label><input id="phone" type="tel"></div>

      <div class="full"><label>Address</label><input id="addr" type="text"></div>

      <div>
        <label>City</label>
        <input id="city" type="text" list="city-list" autocomplete="off">
        <datalist id="city-list"></datalist>
      </div>

      <div>
        <label>State / Region</label>
        <input id="state" type="text" placeholder="Auto (can be edited)">
      </div>

      <div><label>Country</label><input id="country" type="text"></div>

      <div><label>Website</label><input id="website" type="url"></div>

      <div class="full">
        <label>Type</label>
        <div class="type-group">
          <label class="type-btn"><input type="checkbox" value="store"> Store</label>
          <label class="type-btn"><input type="checkbox" value="lounge"> Lounge</label>
        </div>
      </div>

      <div class="full">
        <label>Access</label>
        <div class="access-group">
          <label class="access-pill">
            <input type="radio" name="access" value="public">
            <span>Public</span>
          </label>
          <label class="access-pill">
            <input type="radio" name="access" value="members">
            <span>Members Only</span>
          </label>
        </div>
      </div>

      <div class="full">
        <label>Comment</label>
        <textarea id="comment"></textarea>
      </div>

      <div class="full">
        <label>Photo Preview</label>
        <div class="photo-picker">
          <button id="prev-photo" class="photo-nav">◀</button>
          <img id="preview-photo" class="preview-photo"
               src="https://worldcigarlocator-maker.github.io/Worldcigarlocator/images/store.jpg" />
          <button id="next-photo" class="photo-nav">▶</button>
        </div>
        <div id="photo-meta" style="text-align:center;margin-top:.4rem;">No photo loaded</div>
      </div>

      <div class="full actions">
        <button class="btn-ghost" onclick="window.location.href='index.html'">
          Back to Home
        </button>
        <button id="saveBtn" class="btn-primary">
          Save
        </button>
      </div>

    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/add-shared.js"></script>
  <script src="js/add-store.js"></script>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDdn7E6_dfwUjGQ1IUdJ2rQXUeEYIIzVtQ&libraries=places&callback=initAutocomplete&language=en" async defer></script>

</body>
</html>
