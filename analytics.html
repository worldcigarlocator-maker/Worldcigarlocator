<!DOCTYPE html>

<html lang="en">

<head>

  <!-- ============================================================
       META
       ============================================================ -->

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics — World Cigar Locator</title>

  <!-- ============================================================
       FAVICON
       ============================================================ -->

  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="mask-icon" href="/images/favicon.svg" color="#73624B">
  <meta name="theme-color" content="#050505">

  <!-- ============================================================
       SUPABASE
       ============================================================ -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ============================================================
       STYLES
       ============================================================ -->

  <link rel="stylesheet" href="css/analytics.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="analytics">

  <!-- ============================================================
       TOPBAR
       ============================================================ -->

  <header class="topbar">
    <h1>World Cigar Locator — Analytics</h1>
    <nav class="nav">
      <a class="navlink" href="backoffice.html">Backoffice</a>
    </nav>
  </header>

  <!-- ============================================================
       GLOBAL CONTROLS (KPI + TOOLBAR)
       ============================================================ -->

  <section class="panel top-controls">


<div class="top-controls-inner">

  <!-- KPI -->
  <div class="kpi-primary">

    <div class="kpi-card kpi-users active" data-kpi="users">
      <span class="kpi-label">Users</span>
      <span class="kpi-value" id="globalUsers">0</span>
    </div>

    <div class="kpi-card kpi-stores" data-kpi="stores">
      <span class="kpi-label">Stores</span>
      <span class="kpi-value" id="globalStores">0</span>
    </div>

    <div class="kpi-card kpi-market" data-kpi="views">
      <span class="kpi-label">Market</span>
      <span class="kpi-value" id="globalMarket">0</span>
    </div>

  </div>

  <!-- TOOLBAR -->
  <div class="searchrow">

    <div class="searchbox">
      <input id="searchInput" type="text" placeholder="Search..." />
    </div>

    <button id="searchBtn" class="btn primary">Search</button>
    <button id="clearBtn" class="btn ghost">Clear</button>
    <button id="exportBtn" class="btn ghost">Export PDF</button>
    <button id="mailBtn" class="btn ghost">Send Email</button>

  </div>

</div>


  </section>


 <!-- ============================================================
     USERS
     ============================================================ -->

<section id="view-users">

  <!-- ============================================================
       USERS OVERVIEW
       ============================================================ -->

  <section class="panel">


<div class="panelhead">
  <div class="panel-title">
    <span class="panel-icon">👥</span>
    <h2>Users</h2>
  </div>
</div>

<div class="tablewrap">
  <table class="table" id="overviewTable">
    <thead>
      <tr>
        <th id="ovKeyHeader">Date</th>
        <th class="num">Users</th>
      </tr>
    </thead>
    <tbody id="overviewTableBody">
      <tr>
        <td colspan="2" class="muted center">
          Loading users…
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- 🔥 CHART (MÅSTE VARA I SYNLIG PANEL) -->
<div class="chart-panel">
  <canvas id="usersChart"></canvas>
</div>


  </section>

  <!-- ============================================================
       USERS DRILLDOWN (HIDDEN)
       ============================================================ -->

  <section class="panel hidden" id="usersDrillPanel">


<div class="panelhead">
  <h2>Users Drilldown</h2>
</div>

<div class="tablewrap">
  <table class="table" id="usersDrillTable">
    <thead>
      <tr>
        <th>Location</th>
        <th class="num">Users</th>
      </tr>
    </thead>
    <tbody id="usersDrillBody">
      <tr>
        <td colspan="2" class="muted center">
          No data yet
        </td>
      </tr>
    </tbody>
  </table>
</div>


  </section>

</section>


 <!-- ============================================================
     MARKET
     ============================================================ -->

<section id="view-market" class="hidden">

  <section class="panel">

    <div class="panelhead market-head">

      <h2>Market</h2>

      <div class="market-controls">

        <!-- KPI TOGGLE -->
        <div class="market-toggle">
          <button class="toggle-btn active" data-sort="views">Views</button>
          <button class="toggle-btn" data-sort="clicks">Clicks</button>
          <button class="toggle-btn" data-sort="ctr">CTR</button>
        </div>

        <!-- CHART TYPE TOGGLE -->
        <div class="chart-toggle">
          <button class="chart-type-btn active" data-type="bar">Bar</button>
          <button class="chart-type-btn" data-type="line">Line</button>
        </div>

      </div>

    </div>

    <!-- TABLE -->
    <div class="tablewrap">
      <table class="table">
        <thead>
          <tr>
            <th>Location</th>
            <th class="num">Views</th>
            <th class="num">Clicks</th>
            <th class="num">CTR</th>
          </tr>
        </thead>
        
<div id="filterInfo" class="filter-info hidden"></div>
        <tbody id="marketDemandBody">
          <tr>
            <td colspan="4" class="muted center">
              Loading market data…
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- CHART -->
    <div class="chart-panel">
      <canvas id="marketChart"></canvas>
    </div>

  </section>

</section>

  <!-- ============================================================
       STORES
       ============================================================ -->

  <section id="view-stores" class="hidden">


<section class="panel">

  <div class="panelhead">
    <h2>Top Stores</h2>
  </div>

  <div class="tablewrap">
    <table class="table">
      <thead>
        <tr>
          <th>Store</th>
          <th class="num">Views</th>
          <th class="num">Clicks</th>
          <th class="num">CTR</th>
        </tr>
      </thead>
      <tbody id="topStoresBody">
        <tr>
          <td colspan="4" class="muted center">Loading top stores…</td>
        </tr>
      </tbody>
    </table>
  </div>

</section>


  </section>

  <!-- ============================================================
       CONFIG
       ============================================================ -->

  <script>
    window.WCL_ANALYTICS_CFG = {
      supabaseUrl: "https://gbxxoeplkzbhsvagnfsr.supabase.co",
      supabaseAnonKey: "YOUR_KEY"
    };
  </script>

  <!-- ============================================================
       SCRIPT
       ============================================================ -->

  <script type="module" src="js/analytics.js"></script>

</body>
</html>
