<!DOCTYPE html>

<html lang="en">

<head>

  <!-- ============================================================
       META
       ============================================================ -->

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics — World Cigar Locator</title>

  <!-- ============================================================
       FAVICON
       ============================================================ -->

  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="mask-icon" href="/images/favicon.svg" color="#73624B">
  <meta name="theme-color" content="#050505">

  <!-- ============================================================
       SUPABASE
       ============================================================ -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ============================================================
       STYLES
       ============================================================ -->

  <link rel="stylesheet" href="css/analytics.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

</head>

<body class="analytics">

  <!-- ============================================================
       TOPBAR
       ============================================================ -->

  <header class="topbar">
    <a class="analytics-brand" href="analytics.html" aria-label="World Cigar Locator Analytics">
      <img src="images/wcl_brand_text_no_url.png" alt="World Cigar Locator" />
    </a>
    <nav class="nav">
      <a class="navlink" href="backoffice.html">Backoffice</a>
    </nav>
  </header>

  <!-- ============================================================
       GLOBAL CONTROLS (KPI + TOOLBAR)
       ============================================================ -->

  <section class="panel top-controls">


<div class="top-controls-inner">

  <!-- KPI -->
  <div class="kpi-primary">

    <div class="kpi-card kpi-market active" data-kpi="views">
      <span class="kpi-label">Page loads</span>
      <span class="kpi-value" id="globalPageLoads">0</span>
    </div>

    <div class="kpi-card kpi-market" data-kpi="views">
      <span class="kpi-label">Store opens</span>
      <span class="kpi-value" id="globalStoreOpens">0</span>
    </div>

    <div class="kpi-card kpi-clicks" data-kpi="clicks">
      <span class="kpi-label">Website clicks</span>
      <span class="kpi-value" id="globalWebsiteClicks">0</span>
    </div>

    <div class="kpi-card kpi-users" data-kpi="users">
      <span class="kpi-label">Members</span>
      <span class="kpi-value" id="globalUsers">0</span>
    </div>

    <div class="kpi-card kpi-stores" data-kpi="stores">
      <span class="kpi-label">Stores</span>
      <span class="kpi-value" id="globalStores">0</span>
    </div>

  </div>

  <!-- TOOLBAR -->
  <div class="searchrow">

    <select id="globalRange" class="btn ghost" aria-label="Analytics range">
      <option value="1">Today</option>
      <option value="7" selected>7 days</option>
      <option value="30">30 days</option>
    </select>

    <div class="searchbox">
      <input id="searchInput" type="text" placeholder="Search country, store or ID..." />
    </div>

    <button id="searchBtn" class="btn primary">Search</button>
    <button id="clearBtn" class="btn ghost">Clear</button>
    <button id="exportBtn" class="btn ghost">Export PDF</button>
    <button id="mailBtn" class="btn ghost">Send Email</button>

  </div>

</div>


  </section>


 <!-- ============================================================
     USERS
     ============================================================ -->

<section id="view-users">

  <!-- ============================================================
       USERS OVERVIEW
       ============================================================ -->

  <section class="panel">


<div class="panelhead">
 <div class="panel-title">
  <span class="panel-icon">👥</span>
  <h2>Members</h2>
</div>
</div>

<div class="tablewrap">
  <table class="table" id="overviewTable">
    <thead>
      <tr>
       <th id="ovKeyHeader">Date</th>
<th class="num">Members</th>
      </tr>
    </thead>
    <tbody id="overviewTableBody">
      <tr>
        <td colspan="2" class="muted center">
         Loading members…
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- CHART (MÅSTE VARA I SYNLIG PANEL) -->
<div class="chart-panel">
  <canvas id="usersChart"></canvas>
</div>


  </section>

  <!-- ============================================================
       USERS DRILLDOWN (HIDDEN)
       ============================================================ -->

  <section class="panel hidden" id="usersDrillPanel">


<div class="panelhead">
 <h2>Members Drilldown</h2>
</div>

<div class="tablewrap">
  <table class="table" id="usersDrillTable">
    <thead>
      <tr>
     <th>Location</th>
<th class="num">Members</th>
      </tr>
    </thead>
    <tbody id="usersDrillBody">
      <tr>
        <td colspan="2" class="muted center">
          No data yet
        </td>
      </tr>
    </tbody>
  </table>
</div>


  </section>

</section>


 <!-- ============================================================
     MARKET
     ============================================================ -->

<section id="view-market" class="hidden">

  <section class="panel">

    <div id="marketBreadcrumb" class="market-breadcrumb hidden"></div>
    <div class="panelhead market-head">

      <h2>Market</h2>

      <div class="market-controls">

<div class="member-range-toggle">

  <button
    class="member-range-btn active"
    data-range="7">
    7D
  </button>

  <button
    class="member-range-btn"
    data-range="30">
    30D
  </button>

</div>

        <!-- KPI TOGGLE -->
        <div class="market-toggle">
          <button class="toggle-btn active" data-sort="views">Views</button>
          <button class="toggle-btn" data-sort="clicks">Clicks</button>
          <button class="toggle-btn" data-sort="ctr">CTR</button>
        </div>

        <!-- CHART TYPE TOGGLE -->
        <div class="chart-toggle">
          <button class="chart-type-btn active" data-type="bar">Bar</button>
          <button class="chart-type-btn" data-type="line">Line</button>
        </div>

      </div>

    </div>

    <!-- TABLE -->

<div class="tablewrap">

  <div
    id="filterInfo"
    class="filter-info hidden">
  </div>

  <table
    class="table"
    id="marketDemandTable">

    <thead>
      <tr>
        <th>Location</th>
        <th class="num">Views</th>
        <th class="num">Clicks</th>
        <th class="num">CTR</th>
      </tr>
    </thead>

    <tbody id="marketDemandBody">

      <tr>
        <td colspan="4" class="muted center">
          Loading market data…
        </td>
      </tr>

    </tbody>

  </table>

</div>

    <!-- CHART -->
    <div class="chart-panel">
      <canvas id="marketChart"></canvas>
    </div>

  </section>

</section>

  <!-- ============================================================
       STORES
       ============================================================ -->

  <section id="view-stores" class="hidden">


<section class="panel">

  <div class="panelhead">
    <h2>Top Stores</h2>
  </div>

  <div class="tablewrap">
    <table class="table">
      <thead>
        <tr>
          <th>Store</th>
          <th class="num">Views</th>
          <th class="num">Clicks</th>
          <th class="num">CTR</th>
        </tr>
      </thead>
      <tbody id="topStoresBody">
        <tr>
          <td colspan="4" class="muted center">Loading top stores…</td>
        </tr>
      </tbody>
    </table>
  </div>

</section>


  </section>

  <!-- ============================================================
       SCRIPT
       ============================================================ -->

  <script type="module" src="js/analytics.js"></script>

</body>
</html>
