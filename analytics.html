<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics — World Cigar Locator</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>

  <style>
    :root{
      --primary:#2f78c4;
      --bg:#f5f6f8;
      --card:#fff;
      --text:#1f2937;
      --border:#e5e7eb;
    }
    *{box-sizing:border-box}
    body{
      font-family:Arial,Helvetica,sans-serif;
      background:var(--bg);
      margin:0;
      padding:1.2rem;
      color:var(--text);
      font-size:12px;
    }
    h1{
      text-align:center;
      margin:0 0 1rem;
      font-size:1.4rem;
      font-weight:800;
    }
    nav{
      display:flex;
      justify-content:center;
      gap:.5rem;
      margin-bottom:1rem;
    }
    nav a{
      background:#fff;
      border:1px solid var(--primary);
      color:var(--primary);
      padding:.35rem .6rem;
      border-radius:7px;
      font-weight:800;
      text-decoration:none;
    }
    nav a:hover{
      background:var(--primary);
      color:#fff;
    }
    .panel{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:9px;
      padding:1rem;
      margin-bottom:1rem;
    }
    .panel-title{
      text-align:center;
      font-weight:900;
      margin-bottom:.6rem;
    }
    table{
      width:100%;
      border-collapse:collapse;
      margin-top:.6rem;
    }
    th,td{
      padding:.45rem;
      border-bottom:1px solid #eee;
      text-align:left;
    }
    th{
      background:#f3f4f6;
    }
    td.num{
      text-align:center;
      font-weight:700;
    }
  </style>
</head>

<body>

<h1>World Cigar Locator — Analytics</h1>

<nav>
  <a href="backoffice.html">Backoffice</a>
  <a href="add-store-backoffice.html">Add Store</a>
</nav>

<!-- ===================== PANEL: TOP CITIES ===================== -->
<div class="panel">
  <div class="panel-title">
    Top Cities by Website Clicks — Last 7 Days
  </div>

  <canvas id="cityChart" height="90"></canvas>

  <table>
    <thead>
      <tr>
        <th>City</th>
        <th>Country</th>
        <th class="num">Clicks</th>
      </tr>
    </thead>
    <tbody id="cityTableBody"></tbody>
  </table>
</div>

<script>
  /* ============================================================
     SUPABASE INIT
     ============================================================ */
  const supabase = window.supabase.createClient(
    "https://gbxxoeplkzbhsvagnfsr.supabase.co",
    "YOUR_PUBLIC_ANON_KEY_HERE"
  );

  let chart = null;

  /* ============================================================
     LOAD DATA — TOP CITIES (LAST 7 DAYS)
     ============================================================ */
  async function loadTopCities() {
    const since = new Date();
    since.setDate(since.getDate() - 7);

    const { data, error } = await supabase
      .from("analytics_events")
      .select("payload, timestamp")
      .eq("event_type", "website_clicked")
      .gte("timestamp", since.toISOString());

    if (error) {
      console.error(error);
      return;
    }

    // Aggregate by city + country
    const map = new Map();

    (data || []).forEach(e => {
      const city = e.payload?.city || "Unknown";
      const country = e.payload?.country || "Unknown";
      const key = city + "||" + country;

      if (!map.has(key)) {
        map.set(key, { city, country, clicks: 0 });
      }
      map.get(key).clicks++;
    });

    const rows = [...map.values()].sort((a,b)=>b.clicks-a.clicks);

    renderTable(rows);
    renderChart(rows.slice(0,15));
  }

  /* ============================================================
     RENDER TABLE
     ============================================================ */
  function renderTable(rows) {
    const tbody = document.getElementById("cityTableBody");
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;color:#777;">No data</td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map(r => `
      <tr>
        <td>${r.city}</td>
        <td>${r.country}</td>
        <td class="num">${r.clicks}</td>
      </tr>
    `).join("");
  }

  /* ============================================================
     RENDER CHART
     ============================================================ */
  function renderChart(rows) {
    const ctx = document.getElementById("cityChart").getContext("2d");

    if (chart) chart.destroy();

    chart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: rows.map(r => r.city),
        datasets: [{
          data: rows.map(r => r.clicks),
          backgroundColor: "#2f78c4"
        }]
      },
      options: {
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true }
        }
      }
    });
  }

  loadTopCities();
</script>

</body>
</html>
