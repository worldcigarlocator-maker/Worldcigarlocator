<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Reset Password — WCL</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family:sans-serif;padding:2rem;">
  <h2>Reset your password</h2>
  <input id="newpass" type="password" placeholder="New password" style="padding:.5rem;font-size:1rem;">
  <button id="savepass">Save new password</button>
  <p id="msg"></p>

  <script>
    const supabase = window.supabase.createClient(
      "https://gbxxoeplkzbhsvagnfsr.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdieHhvZXBsa3piaHN2YWduZnNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2NjQ1MDAsImV4cCI6MjA3MzI0MDUwMH0.E4Vk-GyLe22vyyfRy05hZtf4t5w_Bd_B-tkEFZ1alT4"
    );

    document.getElementById("savepass").addEventListener("click", async () => {
      const newpass = document.getElementById("newpass").value.trim();
      const { error } = await supabase.auth.updateUser({ password: newpass });
      const msg = document.getElementById("msg");
      if (error) msg.textContent = "❌ " + error.message;
      else msg.textContent = "✅ Password updated successfully. You can now close this tab.";
    });
  </script>
</body>
</html>
