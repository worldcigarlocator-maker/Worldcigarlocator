<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — World Cigar Locator</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Extra fallback om style.css inte laddas */
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg, #f7f9fb);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .login-card {
      background: var(--card-bg, #fff);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: var(--shadow, 0 2px 6px rgba(0,0,0,0.05));
      text-align: center;
      width: 320px;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 1rem;
    }

    input {
      width: 100%;
      padding: .6rem;
      border: 1px solid var(--border, #ddd);
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    button {
      width: 100%;
      padding: .6rem;
      border: 0;
      border-radius: 8px;
      background: var(--blue, #007bff);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
    }

    #msg {
      margin-top: 1rem;
      font-size: .95rem;
      color: var(--text, #222);
      min-height: 1.2em;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Reset your password</h2>
    <p class="muted">Enter your new password below</p>

    <input id="newpass" type="password" placeholder="New password" autocomplete="new-password" />
    <button id="savepass">Save New Password</button>

    <p id="msg"></p>
  </div>

  <script>
    const supabase = window.supabase.createClient(
      "https://gbxxoeplkzbhsvagnfsr.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdieHhvZXBsa3piaHN2YWduZnNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2NjQ1MDAsImV4cCI6MjA3MzI0MDUwMH0.E4Vk-GyLe22vyyfRy05hZtf4t5w_Bd_B-tkEFZ1alT4"
    );

    document.getElementById("savepass").addEventListener("click", async () => {
      const newpass = document.getElementById("newpass").value.trim();
      const msg = document.getElementById("msg");

      if (!newpass) {
        msg.textContent = "⚠️ Please enter a new password.";
        msg.style.color = "#d33";
        return;
      }

      const { error } = await supabase.auth.updateUser({ password: newpass });

      if (error) {
        msg.textContent = error.message;
        msg.style.color = "#d33";
      } else {
        msg.textContent = "Password updated successfully. You can now log in via Backoffice.";
        msg.style.color = "green";
      }
    });
  </script>
</body>
</html>
