<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WCL Logo Lab</title>

  <style>
    /* =========================
       RESET
       ========================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0b0b; /* ändra till #fff för ljus test */
      font-family: "Times New Roman", Georgia, serif;
    }

    /* =========================
       LOGO WRAPPER
       ========================= */
    .logo-stage {
      position: relative;
      text-align: center;
    }

    /* =========================
       LOGO TEXT
       ========================= */
    .logo-text {
      font-size: 96px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #d6b25e; /* guld */
    }

    /* =========================
       REFLECTION
       ========================= */
    .logo-reflection {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      transform: scaleY(-1);
      opacity: 0.35;
      filter: blur(1px);
      mask-image: linear-gradient(
        to bottom,
        rgba(0,0,0,0.4),
        rgba(0,0,0,0)
      );
    }

    .logo-reflection .logo-text {
      color: #d6b25e;
    }
  </style>
</head>
<body>

  <div class="logo-stage">
    <div class="logo-text">WORLD CIGAR LOCATOR</div>
    <div class="logo-reflection">
      <div class="logo-text">WORLD CIGAR LOCATOR</div>
    </div>
  </div>

</body>
</html>
