<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>World Cigar Locator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/start.css">
  <link rel="stylesheet" href="css/sidebar.css">
</head>

<body>

<div class="container">

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar">

    <header class="sidebar-header">

      <!-- BRAND (LOCKED · FULL LOGO · STATIC) -->
      <div class="sidebar-brand" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 600 600"
          class="sidebar-logo"
        >
          <defs>
            <style>
              .ink { fill: none; stroke: currentColor; stroke-width: 6; }
              .text { fill: currentColor; }
              .map { fill: currentColor; opacity: 0.28; }
            </style>
          </defs>

          <!-- Ring -->
          <circle cx="300" cy="300" r="220" class="ink"/>
          <circle cx="300" cy="300" r="200" class="ink"/>

          <!-- Map -->
          <g class="map" transform="translate(300 330) scale(1.05)">
            <path d="M-165 -10c25-35 55-55 70-90 10-22 0-45-20-55-18-9-42 6-55 20-18 20-32 44-44 72-10 22-5 43 12 53 12 7 24 8 37 0z"/>
            <path d="M10 -65c65-35 140-10 170 20 18 18 12 40-12 52-30 14-62 18-88 32-28 15-42 44-28 64 12 18 44 16 64 6 26-14 40-38 66-44 18-4 34 2 40 16 10 22-8 50-30 64-30 18-72 26-108 24-58-4-108-28-130-78-14-30-12-64 10-86 12-12 28-18 46-14z"/>
            <path d="M120 70c24-8 52 2 64 18 10 14 4 30-14 38-20 10-44 8-58-6-12-12-10-32 8-40z"/>
          </g>

          <!-- Text -->
          <g class="text" text-anchor="middle">
            <text x="300" y="250" font-size="54" font-family="Georgia, 'Times New Roman', serif">World Cigar</text>
            <text x="300" y="305" font-size="54" font-family="Georgia, 'Times New Roman', serif">Locator</text>
          </g>

          <!-- Magnifier -->
          <g transform="translate(420 380)">
            <circle cx="0" cy="0" r="70" class="ink"/>
            <line x1="48" y1="48" x2="110" y2="110" class="ink"/>
          </g>
        </svg>
      </div>

      <!-- ACTIONS -->
      <div class="sidebar-actions">
        <button class="sidebar-btn">Login</button>
        <button class="sidebar-btn primary">Add Store</button>
      </div>

    </header>

    <div id="sidebarMenu" class="sidebar-menu">
      <!-- sidebar.js bygger innehållet -->
    </div>

    <footer class="sidebar-footer">
      <a href="mailto:support@worldcigarlocator.com">Contact / Support</a>
    </footer>

  </aside>

  <!-- ================= MAIN ================= -->
  <main class="main">

    <!-- SEARCH -->
    <div class="search-shell">
      <div class="search-capsule">
        <div class="search-left">
          <strong>Search</strong>
          <em>e.g. London, New York, Bangkok</em>
        </div>

        <div class="search-divider"></div>

        <div class="search-right">
          <span>Store</span>
          <span>Lounge</span>
          <span>Members</span>
        </div>

        <button class="search-icon" aria-label="Search">
          <svg viewBox="0 0 140 140">
            <circle cx="60" cy="60" r="44" />
            <line x1="92" y1="92" x2="130" y2="130" />
          </svg>
        </button>
      </div>
    </div>

    <!-- HERO -->
    <section class="hero">
      <img src="images/world-cigar-locator-hero.jpg" alt="World Cigar Locator">
    </section>

    <!-- RESULTS -->
    <div id="storeGrid"></div>

  </main>

</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
