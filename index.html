<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Cigar Locator – Age Verification</title>
  <link rel="stylesheet" href="css/start.css" />

<script>
  const correctPassword = "jockefylla";
  const stored = sessionStorage.getItem("wclAccess");

  if (stored !== correctPassword) {
    const input = prompt("🔒 Enter password to access World Cigar Locator:");
    if (input !== correctPassword) {
      alert("Access denied.");
      window.location.href = "https://google.com";
    } else {
      sessionStorage.setItem("wclAccess", correctPassword);
    }
  }
</script>

  
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #111;
      color: #fff;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    h1 {
      color: var(--accent, #c9a227);
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: #ccc;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
    }
    .btns {
      display: flex;
      gap: 1rem;
    }
    button {
      background: var(--accent, #c9a227);
      border: none;
      color: #111;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    button:hover {
      background: #b38d1f;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <h1>Welcome to World Cigar Locator</h1>
  <p>You must be 18 years or older to enter.</p>
  <div class="btns">
    <button onclick="enterSite()">Yes, I’m 18+</button>
    <button onclick="denyAccess()">No</button>
  </div>
  
  <script>
    function enterSite() {
      window.location.href = "start.html"; // 👉 den publika front-end sidan
    }
    function denyAccess() {
      document.body.innerHTML = "<h2>Sorry, you must be 18+ to access this site.</h2>";
    }
  </script>
</body>
</html>
