<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>World Cigar Locator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="css/start.css">
  <link rel="stylesheet" href="css/search.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/modal.css">
</head>

<body>

  <!-- ============================================================
       LOGIN POPUP — FULLSCREEN AUTH GATE
  ============================================================ -->
  <div id="loginPopup" class="login-popup hidden">
    <div class="login-box">
      <h2>Login</h2>

      <input id="loginEmail" type="email" placeholder="Email" autocomplete="email" />
      <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" />

      <label class="remember">
        <input type="checkbox" id="rememberMe" />
        Remember me
      </label>

      <button id="loginSubmit">
        <span class="login-text">Login</span>
        <span id="loginSpinner" class="hidden">⏳</span>
      </button>
    </div>
  </div>

  <!-- ============================================================
       APP
  ============================================================ -->
  <div class="container">

    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar">

      <header class="sidebar-header">

        <div class="sidebar-brand" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160">
            <text
              x="260"
              y="100"
              text-anchor="middle"
              font-size="56"
              fill="rgb(115, 98, 75)"
              font-family="Georgia, 'Times New Roman', serif"
            >
              World Cigar Locator
            </text>
          </svg>
        </div>

        <div class="sidebar-actions">
          <button class="sidebar-btn">Login</button>
          <button class="sidebar-btn primary">Add Store</button>
        </div>
        
  <div class="sidebar-total">
    <span id="sidebarGlobalCount"></span>
  </div>
        
      </header>

      <div id="sidebarMenu" class="sidebar-menu"></div>

      <footer class="sidebar-footer">
        <a href="mailto:support@worldcigarlocator.com">Contact / Support</a>
      </footer>

    </aside>

    <!-- ================= MAIN ================= -->
    <main class="main">

      <!-- ================= SEARCH ================= -->
      <div class="search-capsule">

        <!-- SEARCH -->
        <div class="search-zone zone-search" id="searchZone">
          <span class="search-label">Search</span>
          <input
            id="searchInput"
            type="text"
            placeholder="e.g. London, New York, Bangkok"
            autocomplete="off"
          />
        </div>

        <div class="zone-divider"></div>

        <!-- FILTERS + SORT -->
        <div class="search-zone zone-filters" id="searchControls">
          <button class="control-btn" data-filter="type" data-value="store">Stores</button>
          <button class="control-btn" data-filter="type" data-value="lounge">Lounge</button>
          <button class="control-btn" data-filter="access" data-value="members">Members</button>

          <button class="control-btn sort-btn" data-sort="rating_desc">Highest ranked</button>
          <button class="control-btn sort-btn" data-sort="newest">Newest</button>
        </div>

        <div class="zone-divider"></div>

        <!-- CLEAR -->
        <div class="search-zone zone-clear">
          <button class="clear-btn" id="clearBtn" aria-label="Clear search">
            Clear
          </button>
        </div>

      </div>

      <!-- ================= HERO ================= -->
      <section class="hero" id="heroImage">
        <img
          src="images/world-cigar-locator-hero.jpg"
          alt="World Cigar Locator"
        >
        <div id="heroText"></div>
      </section>

      <!-- ================= RESULTS ================= -->
      <div class="results-toolbar">
        <h2 id="resultHeading"></h2>
      </div>

      <div id="storeGrid"></div>

    </main>

  </div>

  <!-- ================= SCRIPTS ================= -->
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/search-v2.js"></script>

  <!-- ================= MODAL ================= -->
  <div id="storeModal" class="modal hidden">
    <div class="modal-backdrop"></div>

    <div class="modal-content">
      <button class="modal-close">✕</button>

      <img id="modalImg" class="modal-img" alt="" />

      <div class="modal-body">
        <h2 id="modalName" class="modal-title"></h2>

        <div class="modal-location">
          <img id="modalFlag" class="flag" />
          <span id="modalLocation"></span>
        </div>

        <div id="modalBadges" class="modal-badges"></div>

        <div class="modal-info">
          <p><strong>Address:</strong> <span id="modalAddress"></span></p>
          <p><strong>Phone:</strong> <span id="modalPhone"></span></p>
          <p>
            <a id="modalWebsite" href="#" target="_blank" rel="noopener">
              Visit website
            </a>
          </p>
        </div>

        <div class="modal-rating">
          <h3>Your rating</h3>

          <div id="modalStarPicker" class="star-picker">
            <span data-val="1">☆</span>
            <span data-val="2">☆</span>
            <span data-val="3">☆</span>
            <span data-val="4">☆</span>
            <span data-val="5">☆</span>
          </div>

          <button id="modalSendRating">Submit rating</button>
        </div>

        <div class="modal-comments">
          <div class="modal-comments-header">
            <span id="modalCommentCount" class="modal-count-pill">
              Comments 0
            </span>
          </div>

          <textarea
            id="modalCommentInput"
            placeholder="Write a comment…"
          ></textarea>

          <button id="modalSendComment">Post comment</button>

          <div id="modalComments" class="modal-comments-feed"></div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
