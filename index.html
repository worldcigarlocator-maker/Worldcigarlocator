<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>World Cigar Locator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/start.css">
  <link rel="stylesheet" href="css/sidebar.css">
</head>

<body>

<div class="container">

<!-- ================= SIDEBAR ================= -->
<aside class="sidebar">

  <header class="sidebar-header">

    <!-- BRAND (SVG · ONE LINE · GLOBAL COLOUR) -->
    <div class="sidebar-brand" aria-hidden="true">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 520 160"
        class="sidebar-brand-svg"
      >
        <style>
          .text {
            fill: rgb(115, 98, 75); /* 🔒 global colour */
            font-family: Georgia, 'Times New Roman', serif;
          }
        </style>

        <text
          x="260"
          y="100"
          text-anchor="middle"
          class="text"
          font-size="56"
        >
          World Cigar Locator
        </text>
      </svg>
    </div>

    <!-- ACTIONS -->
    <div class="sidebar-actions">
      <button class="sidebar-btn">Login</button>
      <button class="sidebar-btn primary">Add Store</button>
    </div>

  </header>

  <div id="sidebarMenu" class="sidebar-menu">
    <!-- sidebar.js bygger innehållet -->
  </div>

  <footer class="sidebar-footer">
    <a href="mailto:support@worldcigarlocator.com">Contact / Support</a>
  </footer>

</aside>


<!-- ================= MAIN ================= -->

  <main class="main">

    <!-- SEARCH -->
    <div class="search-shell">
      <div class="search-capsule">
        <div class="search-left">
          <strong>Search</strong>
          <em>e.g. London, New York, Bangkok</em>
        </div>

        <div class="search-divider"></div>

        <div class="search-right">
          <span>Store</span>
          <span>Lounge</span>
          <span>Members</span>
        </div>

        <button class="search-icon" aria-label="Search">
          <svg viewBox="0 0 140 140">
            <circle cx="60" cy="60" r="44" />
            <line x1="92" y1="92" x2="130" y2="130" />
          </svg>
        </button>
      </div>
    </div>

    <!-- HERO -->
    <section class="hero">
      <img src="images/world-cigar-locator-hero.jpg" alt="World Cigar Locator">
    </section>

    <!-- RESULTS -->
    <div id="storeGrid"></div>

  </main>

</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
