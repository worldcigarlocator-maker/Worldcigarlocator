<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Backoffice V5.2 — Moderation + Hierarchy</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Fonts & CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/backoffice.css" />
</head>

<body>
  <div class="wrap">
    <!-- === TOPBAR === -->
    <div class="topbar">
      <div class="left">
        <button class="btn blue" onclick="location.href='add-store-backoffice.html'">＋ Add Store</button>
        <button class="btn blue" onclick="location.href='analytics.html'">📊 Analytics</button>
        <button class="btn blue" onclick="reloadData()">⟲ Reload</button>
      </div>
      <div class="version-pill">V5.2</div>
    </div>

    <!-- === FILTERS === -->
    <div class="filters">
      <button class="pill" data-tab="all">All</button>
      <button class="pill" data-tab="approved">Approved</button>
      <button class="pill active" data-tab="pending">Pending</button>
      <button class="pill" data-tab="flagged">Flagged</button>
      <button class="pill" data-tab="deleted">Trash</button>
      <button class="pill" data-tab="repair">Needs Repair</button>
    </div>

    <!-- === SEARCH & VIEW === -->
    <div class="searchbar">
      <input id="searchInput" placeholder="Search by name, city, country…" />
      <div class="viewtoggle">
        <span class="seg active" data-view="cards">Cards</span>
        <span class="seg" data-view="list">List</span>
      </div>
    </div>

    <!-- === CARD VIEW === -->
    <div id="cards" class="grid"></div>

    <!-- === LIST VIEW === -->
    <div class="listview-wrap" style="display:none;">
      <div id="hierarchyPanel" class="hierarchy-panel"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Country</th>
              <th>Continent</th>
              <th>City</th>
              <th>Type</th>
              <th>Access</th>
              <th>Rating</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- JS sist -->
  <script src="js/backoffice.js"></script>
</body>
</html>
