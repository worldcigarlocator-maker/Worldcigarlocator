<!-- ============================================================
     LOGIN POPUP (GLASS BLUR)
============================================================ -->
<div id="loginPopup" class="login-modal hidden">
  <div class="login-box">
    <h2>Login Required</h2>

    <!-- Email -->
    <input 
      id="loginEmail" 
      class="login-field" 
      type="email" 
      placeholder="Email" 
    />

    <!-- Password -->
    <input 
      id="loginPassword" 
      class="login-field" 
      type="password" 
      placeholder="Password" 
    />

    <!-- Remember Me -->
    <label class="remember-wrapper">
      <input type="checkbox" id="rememberMe" />
      <span>Remember me</span>
    </label>

    <!-- Login Button -->
    <button id="loginSubmit" class="login-btn-popup">
      <span class="login-text">Login</span>
      <span id="loginSpinner" class="spinner hidden"></span>
    </button>

    <!-- Forgot Password -->
    <p class="forgot">
      <a href="#" id="forgotPassword">Forgot password?</a>
    </p>
  </div>
</div>
