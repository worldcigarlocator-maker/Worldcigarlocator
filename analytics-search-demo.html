<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics Smart Search Parser (V2)</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#f5f7fa; padding:2rem; color:#222; }
    h1 { margin-bottom:1rem; }
    input[type=text] {
      width:100%; max-width:600px; padding:.6rem .8rem; border:1px solid #ccc;
      border-radius:8px; font-size:1rem; outline:none;
    }
    input[type=text]:focus { border-color:#007bff; }
    pre {
      background:#fff; border:1px solid #eee; padding:1rem; margin-top:1rem;
      border-radius:8px; font-family:monospace; font-size:.9rem;
    }
  </style>
</head>
<body>
  <h1>🔍 Analytics Smart Search Parser (V2)</h1>
  <input id="query" type="text" placeholder="Ex: flagged europe cannabis top50 type:lounge sweden" />
  <pre id="output">Waiting for input…</pre>

  <script>
    const countries = ["sweden","norway","denmark","finland","usa","canada","mexico","spain","italy","france","germany","portugal","uk","england","brazil","argentina","japan","china","thailand","australia","south africa"];
    const continents = ["europe","asia","africa","north america","south america","oceania","other"];
    const cities = ["stockholm","gothenburg","oslo","copenhagen","madrid","barcelona","rome","paris","berlin","london","tokyo","bangkok","new york","los angeles","cape town"];

    function parseQuery(q) {
      q = q.trim().toLowerCase();
      const filters = {
        flagged:false, approved:false, deleted:false, pending:false,
        continent:null, country:null, city:null, type:null, access:null,
        flag_reason:null, sort:null, limit:50
      };

      const parts = q.split(/\s+/);

      for (let p of parts) {
        // status
        if (["flagged","approved","deleted","pending","repair"].includes(p)) {
          filters[p] = true;
          continue;
        }

        // key:value
        const kv = p.split(":");
        if (kv.length === 2) {
          const [key,val] = kv;
          if (["continent","country","city","type","access"].includes(key)) filters[key]=capitalize(val);
          if (["approved","flagged","deleted"].includes(key)) filters[key]=(val==="true");
          if (key==="limit"||key==="top") filters.limit=parseInt(val,10);
          if (key==="sort") filters.sort=val;
          continue;
        }

        // top50 etc
        if (p.startsWith("top") && parseInt(p.slice(3))) { filters.limit=parseInt(p.slice(3)); continue; }

        // sorts
        if (["comments","views","clicks","rating"].includes(p)) { filters.sort=p; continue; }

        // type or access
        if (["store","stores","lounge","lounges"].includes(p)) { filters.type="Store/Lounge"; continue; }
        if (["members","public"].includes(p)) { filters.access=capitalize(p); continue; }

        // continent
        if (continents.includes(p)) { filters.continent=capitalize(p); continue; }

        // country
        if (countries.includes(p)) { filters.country=capitalize(p); continue; }

        // city
        if (cities.includes(p)) { filters.city=capitalize(p); continue; }

        // fallback — flag_reason
        if (!filters.flag_reason) filters.flag_reason = p;
      }

      return filters;
    }

    function capitalize(str){
      if(!str) return "";
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    const input = document.getElementById("query");
    const output = document.getElementById("output");

    input.addEventListener("input", () => {
      const parsed = parseQuery(input.value);
      output.textContent = JSON.stringify(parsed, null, 2);
      console.clear();
      console.log("Parsed filters:", parsed);
    });
  </script>
</body>
</html>
