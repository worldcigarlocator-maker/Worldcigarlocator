<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backoffice — Add Store</title>

  <!-- Supabase client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --accent: #007bff;
      --bg: #f9fafb;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --success: #28a745;
      --error: #dc3545;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1rem;
      font-size: 0.9rem;
    }

    /* HEADER */
    header {
      background: white;
      padding: 0.45rem 0.9rem;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    header h1 {
      font-size: 0.95rem;
      margin: 0;
      font-weight: 700;
    }

    header .btn.home {
      background: white;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 0.35rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    header .btn.home:hover {
      background: var(--accent);
      color: #fff;
    }

    /* MAIN CARD */
    .wrap { max-width: 850px; margin: 0 auto; }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 1rem 1.2rem;
      box-shadow: 0 1px 6px rgba(0,0,0,.05);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .6rem 1rem;
    }
    .full { grid-column: 1 / -1; }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: .2rem;
      font-size: 0.85rem;
    }

    input, select, textarea {
      width: 100%;
      padding: .4rem .5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
      background: #fff;
    }

    textarea { resize: vertical; min-height: 60px; }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.45rem 1rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .btn:hover { background: #005ec4; }

    .type-group, .access-group {
      display: flex;
      gap: .5rem;
      margin-top: .25rem;
      flex-wrap: wrap;
    }

    .type-btn, .access-pill span {
      border: 1px solid var(--accent);
      border-radius: 20px;
      padding: .3rem .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.85rem;
    }

    .type-btn { background: white; color: var(--accent); }
    .type-btn input { display:none; }
    .type-btn.active { background: var(--accent); color: white; }

    .access-pill input { display: none; }
    .access-pill span { color: var(--accent); background: white; }
    .access-pill input:checked + span { background: var(--accent); color: white; }

    .photo-picker {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      margin-top: .4rem;
    }

    .photo-nav {
      border: 1px solid var(--accent);
      color: var(--accent);
      background: white;
      border-radius: 6px;
      padding: .25rem .55rem;
      cursor: pointer;
    }

    .photo-nav:hover { background: #eef5ff; }

    .preview-photo {
      width: 200px;
      height: 130px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    #toast-container {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      display: flex;
      flex-direction: column;
      gap: .4rem;
      z-index: 9999;
    }

    .toast {
      background: #333;
      color: #fff;
      padding: .45rem .8rem;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .toast.success { background: var(--success); }
    .toast.error { background: var(--error); }
  </style>

  <script>
    // ----------------- WCL CONFIG -----------------
    const WCL = {};
    WCL.SUPABASE_URL = "https://gbxxoeplkzbhsvagnfsr.supabase.co";
    WCL.SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdieHhvZXBsa3piaHN2YWduZnNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2NjQ1MDAsImV4cCI6MjA3MzI0MDUwMH0.E4Vk-GyLe22vyyfRy05hZtf4t5w_Bd_B-tkEFZ1alT4";
    WCL.PHOTO_PROXY_URL =
      "https://gbxxoeplkzbhsvagnfsr.functions.supabase.co/photo-proxy";
    WCL.PHOTO_REFS_URL =
      "https://gbxxoeplkzbhsvagnfsr.functions.supabase.co/photo-refs";
    WCL.FALLBACK_IMG =
      "https://worldcigarlocator-maker.github.io/Worldcigarlocator/images/store.jpg";

    WCL.supabase = window.supabase.createClient(
      WCL.SUPABASE_URL,
      WCL.SUPABASE_ANON_KEY
    );

    // Hämta photo_refs via edge-funktion (det här funkade igår 😊)
    WCL.fetchPhotoRefs = async (placeId) => {
      if (!placeId) return [];
      try {
        const res = await fetch(
          `${WCL.PHOTO_REFS_URL}?place_id=${encodeURIComponent(placeId)}`
        );
        if (!res.ok) return [];
        const data = await res.json();
        return Array.isArray(data?.refs) ? data.refs : [];
      } catch (e) {
        console.warn("photo-refs failed", e);
        return [];
      }
    };

    // Ladda bild via proxyn
    WCL.loadProxyPhotoInto = (imgEl, ref) => {
      if (!imgEl) return;
      imgEl.src = ref
        ? `${WCL.PHOTO_PROXY_URL}?photo_reference=${encodeURIComponent(ref)}&maxwidth=800`
        : WCL.FALLBACK_IMG;
    };

    // 🌍 Country → Continent (lite utökad, inkl UK)
    WCL.countryToContinent = (country) => {
      const c = (country || "").toLowerCase();
      if ([
        "sweden","germany","france","italy","spain","norway","finland","denmark",
        "netherlands","belgium","austria","switzerland","poland","czech republic",
        "czechia","portugal","ireland","iceland","estonia","latvia","lithuania",
        "hungary","greece","romania","bulgaria","slovenia","slovakia","croatia",
        "ukraine","united kingdom","england","wales","scotland","northern ireland"
      ].includes(c)) return "Europe";
      if (["united states","usa","canada","mexico","cuba","dominican republic"].includes(c)) return "North America";
      if (["brazil","argentina","chile","peru","colombia","uruguay","paraguay"].includes(c)) return "South America";
      if ([
        "china","japan","india","thailand","malaysia","singapore","israel","turkey",
        "vietnam","indonesia","philippines","south korea","taiwan","united arab emirates",
        "uae","qatar","saudi arabia"
      ].includes(c)) return "Asia";
      if (["south africa","nigeria","kenya","morocco","egypt","ghana"].includes(c)) return "Africa";
      if (["australia","new zealand","fiji"].includes(c)) return "Oceania";
      return "Other";
    };

    WCL.toast = (msg, cls = "success") => {
      const c = document.getElementById("toast-container");
      const t = document.createElement("div");
      t.className = `toast ${cls}`;
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    };
  </script>
</head>

<body>
  <header>
    <h1>Backoffice — Add Store</h1>
    <a href="backoffice.html" class="btn home">🏠 Home</a>
  </header>

  <div class="wrap">
    <div class="card">
      <div class="grid">
        <div class="full">
          <label>Search with Google</label>
          <input id="gAddress" type="text" placeholder="Start typing a place..." />
        </div>

        <div><label>Name</label><input id="name" type="text"></div>
        <div><label>Phone</label><input id="phone" type="tel"></div>
        <div class="full"><label>Address</label><input id="addr" type="text"></div>
        <div><label>City</label><input id="city" type="text"></div>
        <div><label>Country</label><input id="country" type="text"></div>

        <div>
          <label>Continent</label>
          <select id="continent">
            <option value="">(Auto)</option>
            <option>Europe</option>
            <option>North America</option>
            <option>South America</option>
            <option>Asia</option>
            <option>Africa</option>
            <option>Oceania</option>
            <option>Other</option>
          </select>
        </div>

        <div><label>Website</label><input id="website" type="url" placeholder="https://"></div>

        <div class="full">
          <label>Type</label>
          <div class="type-group">
            <label class="type-btn"><input type="checkbox" name="types" value="store"> Store</label>
            <label class="type-btn"><input type="checkbox" name="types" value="lounge"> Lounge</label>
          </div>
        </div>

        <div class="full">
          <label>Access</label>
          <div class="access-group">
            <label class="access-pill"><input type="radio" name="access" value="public"><span>Public</span></label>
            <label class="access-pill"><input type="radio" name="access" value="members"><span>Members Only</span></label>
          </div>
        </div>

        <div class="full">
          <label>Comment</label>
          <textarea id="comment" placeholder="Add an optional comment…"></textarea>
        </div>

        <div class="full">
          <label>Photo Preview</label>
          <div class="photo-picker">
            <button id="prev-photo" class="photo-nav">◀</button>
            <img id="preview-photo" class="preview-photo" src="https://worldcigarlocator-maker.github.io/Worldcigarlocator/images/store.jpg" alt="Preview" />
            <button id="next-photo" class="photo-nav">▶</button>
          </div>
          <div id="photo-meta" class="muted" style="text-align:center;">No photo loaded</div>
        </div>

        <div class="full" style="display:flex;justify-content:flex-end;gap:.6rem;">
          <button class="btn" id="clearBtn">Clear</button>
          <button class="btn" id="saveBtn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script>
    // ----------------- STATE -----------------
    const sel = {
      types: [],
      access: null,
      place_id: null,
      country_iso2: null,
      _photo_refs: [],
      photo_index: 0,
      photo_reference: null,
    };

    // ----------------- HELPERS -----------------
    function resetForm() {
      document.querySelectorAll("input, textarea").forEach(i => {
        if (i.type !== "radio" && i.type !== "checkbox") i.value = "";
      });
      document.querySelectorAll("input[type=checkbox], input[type=radio]").forEach(i => {
        i.checked = false;
      });
      document.querySelectorAll(".type-btn").forEach(b => b.classList.remove("active"));

      sel.types = [];
      sel.access = null;
      sel.place_id = null;
      sel.country_iso2 = null;
      sel._photo_refs = [];
      sel.photo_index = 0;
      sel.photo_reference = null;

      document.getElementById("preview-photo").src = WCL.FALLBACK_IMG;
      document.getElementById("photo-meta").textContent = "No photo loaded";
      WCL.toast("Cleared", "success");
    }

    async function saveStore() {
      const name = nameEl.value.trim();
      const address = addrEl.value.trim();
      const city = cityEl.value.trim();
      const country = countryEl.value.trim();
      const continent = continentEl.value || WCL.countryToContinent(country);
      const phone = phoneEl.value.trim() || null;
      const website = websiteEl.value.trim() || null;
      const commentText = document.getElementById("comment").value.trim();

      if (!name || !address || !city || !country) {
        return WCL.toast("Please fill all required fields", "error");
      }

      const types = sel.types.length ? sel.types : ["store"];

      const payload = {
        name,
        address,
        city,
        country,
        continent,
        phone,
        website,
        types,                     // ✅ JSON-array (store / lounge / båda)
        type: types[0],            // ✅ första typen kvar i text-fältet
        access: sel.access,
        place_id: sel.place_id,
        country_iso2: sel.country_iso2,
        photo_reference: sel.photo_reference || null,
        approved: false,
        flagged: false,
        deleted: false,
        status: "pending",
      };

      const { data, error } = await WCL.supabase
        .from("stores")
        .insert([payload])
        .select()
        .single();

      if (error) {
        console.error(error);
        return WCL.toast("Error saving store", "error");
      }

      // Spara första kommentar som separat rad om man skrev något
      if (commentText) {
        await WCL.supabase.from("store_comments").insert([{
          store_id: data.id,
          comment: commentText,
          user_name: "Backoffice",
        }]);
      }

      WCL.toast("✅ Store saved!", "success");
      resetForm();
    }

    // ----------------- AUTOCOMPLETE -----------------
    function initAutocomplete() {
      const input = document.getElementById("gAddress");
      const ac = new google.maps.places.Autocomplete(input, {
        fields: [
          "place_id",
          "name",
          "formatted_address",
          "address_components",
          "international_phone_number",
          "website"
        ],
        types: ["establishment"],
        language: "en"
      });

      ac.addListener("place_changed", async () => {
        const p = ac.getPlace();
        if (!p) return;

        // Fyll i grunddata
        nameEl.value = p.name || "";
        addrEl.value = p.formatted_address || "";
        phoneEl.value = p.international_phone_number || "";
        websiteEl.value = p.website || "";

        const comps = p.address_components || [];
        const city = comps.find(c => c.types.includes("locality") || c.types.includes("postal_town"));
        const country = comps.find(c => c.types.includes("country"));

        cityEl.value = city?.long_name || "";
        countryEl.value = country?.long_name || "";

        sel.country_iso2 = country?.short_name?.toLowerCase() || null;
        continentEl.value = WCL.countryToContinent(country?.long_name) || "";

        sel.place_id = p.place_id || null;

        // Hämta foton
        const refs = await WCL.fetchPhotoRefs(sel.place_id);
        sel._photo_refs = refs;
        sel.photo_index = 0;

        const imgEl = document.getElementById("preview-photo");
        const metaEl = document.getElementById("photo-meta");

        function showCurrentPhoto() {
          if (!sel._photo_refs.length) {
            imgEl.src = WCL.FALLBACK_IMG;
            metaEl.textContent = "No photo found";
            sel.photo_reference = null;
            return;
          }
          const ref = sel._photo_refs[sel.photo_index];
          sel.photo_reference = ref;
          WCL.loadProxyPhotoInto(imgEl, ref);
          metaEl.textContent = `Photo ${sel.photo_index + 1} / ${sel._photo_refs.length}`;
        }

        // koppla knappar
        document.getElementById("prev-photo").onclick = () => {
          if (!sel._photo_refs.length) return;
          sel.photo_index = (sel.photo_index - 1 + sel._photo_refs.length) % sel._photo_refs.length;
          showCurrentPhoto();
        };
        document.getElementById("next-photo").onclick = () => {
          if (!sel._photo_refs.length) return;
          sel.photo_index = (sel.photo_index + 1) % sel._photo_refs.length;
          showCurrentPhoto();
        };

        showCurrentPhoto();

        WCL.toast(
          refs.length
            ? `✅ ${refs.length} photos found`
            : "No photos found (using fallback image)",
          refs.length ? "success" : "error"
        );
      });
    }

    // Gör initAutocomplete global för Google callback
    window.initAutocomplete = initAutocomplete;

    // ----------------- DOM READY -----------------
    window.addEventListener("DOMContentLoaded", () => {
      window.nameEl = document.getElementById("name");
      window.addrEl = document.getElementById("addr");
      window.cityEl = document.getElementById("city");
      window.countryEl = document.getElementById("country");
      window.continentEl = document.getElementById("continent");
      window.phoneEl = document.getElementById("phone");
      window.websiteEl = document.getElementById("website");

      // Type-checkboxar
      document.querySelectorAll(".type-btn input").forEach(cb => {
        cb.addEventListener("change", () => {
          const val = cb.value;
          const parent = cb.closest(".type-btn");
          if (cb.checked) {
            if (!sel.types.includes(val)) sel.types.push(val);
            parent.classList.add("active");
          } else {
            sel.types = sel.types.filter(t => t !== val);
            parent.classList.remove("active");
          }
          console.log("🟩 Selected types:", sel.types);
        });
      });

      // Access
      document.querySelectorAll(".access-pill input").forEach(radio => {
        radio.addEventListener("change", () => {
          sel.access = radio.value;
        });
      });

      // Buttons
      document.getElementById("clearBtn").onclick = resetForm;
      document.getElementById("saveBtn").onclick = saveStore;
    });
  </script>

  <!-- ✅ Google Places API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDdn7E6_dfwUjGQ1IUdJ2rQXUeEYIIzVtQ&libraries=places&callback=initAutocomplete&language=en" async defer></script>
</body>
</html>
