<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backoffice — Add Store</title>

  <!-- Supabase client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --accent: #007bff;
      --bg: #f9fafb;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --success: #28a745;
      --error: #dc3545;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1rem;
      font-size: 0.9rem;
    }

    header {
      background: white;
      padding: 0.5rem 1rem;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    header h1 {
      font-size: 0.95rem;
      margin: 0;
      font-weight: 700;
    }

    header .btn.home {
      background: white;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 0.35rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    header .btn.home:hover {
      background: var(--accent);
      color: #fff;
    }

    .wrap { max-width: 850px; margin: 0 auto; }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 1rem 1.2rem;
      box-shadow: 0 1px 6px rgba(0,0,0,.05);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .6rem 1rem;
    }

    .full { grid-column: 1 / -1; }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: .2rem;
      font-size: 0.85rem;
    }

    input, select, textarea {
      width: 100%;
      padding: .4rem .5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
      background: #fff;
    }

    textarea { resize: vertical; min-height: 60px; }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.45rem 1rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .btn:hover { background: #005ec4; }

    .type-group, .access-group {
      display: flex;
      gap: .5rem;
      margin-top: .25rem;
      flex-wrap: wrap;
    }

    .type-btn, .access-pill span {
      border: 1px solid var(--accent);
      border-radius: 20px;
      padding: .3rem .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.85rem;
    }

    .type-btn { background: white; color: var(--accent); }
    .type-btn.active { background: var(--accent); color: white; }

    .access-pill input { display: none; }
    .access-pill span { color: var(--accent); background: white; }
    .access-pill input:checked + span { background: var(--accent); color: white; }

    .photo-picker {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      margin-top: .4rem;
    }

    .photo-nav {
      border: 1px solid var(--accent);
      color: var(--accent);
      background: white;
      border-radius: 6px;
      padding: .25rem .55rem;
      cursor: pointer;
    }

    .photo-nav:hover { background: #eef5ff; }

    .preview-photo {
      width: 200px;
      height: 130px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    #toast-container {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      display: flex;
      flex-direction: column;
      gap: .4rem;
      z-index: 9999;
    }

    .toast {
      background: #333;
      color: #fff;
      padding: .45rem .8rem;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .toast.success { background: var(--success); }
    .toast.error { background: var(--error); }
  </style>
</head>

<body>
  <header>
    <h1>Backoffice — Add Store</h1>
    <a href="backoffice.html" class="btn home">🏠 Home</a>
  </header>

  <div class="wrap">
    <div class="card">
      <div class="grid">

        <div class="full">
          <label>Search with Google</label>
          <input id="gAddress" type="text" placeholder="Start typing a place..." />
        </div>

        <div><label>Name</label><input id="name" type="text"></div>
        <div><label>Phone</label><input id="phone" type="tel"></div>
        <div class="full"><label>Address</label><input id="addr" type="text"></div>
   <div>
  <label>City</label>
  <input id="city" type="text" list="city-list" autocomplete="off">
  <datalist id="city-list"></datalist>
</div>


<div>
  <label>State / Region</label>
  <input id="state" type="text" placeholder="Auto (can be edited)">
</div>
    
        <div><label>Country</label><input id="country" type="text"></div>

        <div>
          <label>Continent</label>
          <select id="continent">
            <option value="">(Auto)</option>
            <option>Europe</option>
            <option>North America</option>
            <option>South America</option>
            <option>Asia</option>
            <option>Africa</option>
            <option>Oceania</option>
            <option>Other</option>
          </select>
        </div>

        <div><label>Website</label><input id="website" type="url" placeholder="https://"></div>

        <div class="full">
          <label>Type</label>
          <div class="type-group">
            <label class="type-btn"><input type="checkbox" value="store"> Store</label>
            <label class="type-btn"><input type="checkbox" value="lounge"> Lounge</label>
          </div>
        </div>

        <div class="full">
          <label>Access</label>
          <div class="access-group">
            <label class="access-pill"><input type="radio" name="access" value="public"><span>Public</span></label>
            <label class="access-pill"><input type="radio" name="access" value="members"><span>Members Only</span></label>
          </div>
        </div>

        <div class="full">
          <label>Comment</label>
          <textarea id="comment" placeholder="Add an optional comment…"></textarea>
        </div>

        <div class="full">
          <label>Photo Preview</label>
          <div class="photo-picker">
            <button id="prev-photo" class="photo-nav">◀</button>
            <img id="preview-photo" class="preview-photo" src="https://worldcigarlocator-maker.github.io/Worldcigarlocator/images/store.jpg" alt="Preview" />
            <button id="next-photo" class="photo-nav">▶</button>
          </div>
          <div id="photo-meta" class="muted" style="text-align:center;">No photo loaded</div>
        </div>

        <div class="full" style="display:flex;justify-content:flex-end;gap:.6rem;">
          <button id="clearBtn" class="btn">Clear</button>
          <button id="saveBtn" class="btn">Save</button>
        </div>

      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- 🔗 Shared logic -->
  <script src="js/add-shared.js"></script>

  <!-- 🔗 Page-specific logic -->
  <script src="js/add-store.js"></script>

  <!-- Google Places API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDdn7E6_dfwUjGQ1IUdJ2rQXUeEYIIzVtQ&libraries=places&callback=initAutocomplete&language=en" async defer></script>
</body>
</html>
