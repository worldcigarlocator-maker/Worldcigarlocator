<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backoffice — Add Store</title>

  <!-- Supabase client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    /* ============================================================
       WCL Global Config – Supabase + Google + Proxy
       ============================================================ */
    const WCL = {};

    // ✅ Supabase config
    WCL.SUPABASE_URL = "https://gbxxoeplkzbhsvagnfsr.supabase.co";
    WCL.SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdieHhvZXBsa3piaHN2YWduZnNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2NjQ1MDAsImV4cCI6MjA3MzI0MDUwMH0.E4Vk-GyLe22vyyfRy05hZtf4t5w_Bd_B-tkEFZ1alT4";
    WCL.supabase = window.supabase.createClient(WCL.SUPABASE_URL, WCL.SUPABASE_ANON_KEY);

    // ✅ Proxy setup
    WCL.PHOTO_PROXY_URL = "https://gbxxoeplkzbhsvagnfsr.functions.supabase.co/photo-proxy";
    WCL.GOOGLE_KEY = "AIzaSyDdn7E6_dfwUjGQ1IUdJ2rQXUeEYIIzVtQ";
    WCL.GITHUB_STORE_FALLBACK =
      "https://worldcigarlocator-maker.github.io/Worldcigarlocator/images/store.jpg";

    // ============================================================
    // Helpers
    // ============================================================
    WCL.countryToContinent = (country) => {
      const c = (country || "").toLowerCase();
      if (["sweden","germany","france","italy","spain","norway","finland","denmark","netherlands","belgium","austria","switzerland","poland","czech republic","czechia"].includes(c)) return "Europe";
      if (["united states","usa","canada","mexico","cuba","dominican republic"].includes(c)) return "North America";
      if (["brazil","argentina","chile","peru","colombia","uruguay","paraguay"].includes(c)) return "South America";
      if (["china","japan","india","thailand","malaysia","singapore","israel","turkey","vietnam","indonesia"].includes(c)) return "Asia";
      if (["south africa","nigeria","kenya","morocco","egypt","ghana"].includes(c)) return "Africa";
      if (["australia","new zealand","fiji"].includes(c)) return "Oceania";
      return "Other";
    };

  // ✅ Hämtar photo_reference[] via Supabase Edge-funktion (ingen CORS-blockering)
WCL.fetchPhotoRefs = async (placeId) => {
  const endpoint = `https://gbxxoeplkzbhsvagnfsr.functions.supabase.co/photo-refs?place_id=${encodeURIComponent(placeId)}`;
  try {
    const res = await fetch(endpoint);
    const data = await res.json();
    if (data?.refs?.length) return data.refs;
    console.warn("No photo refs found", data);
    return [];
  } catch (err) {
    console.error("fetchPhotoRefs error:", err);
    return [];
  }
};

    // ✅ Load image through proxy
    WCL.loadProxyPhotoInto = async (imgEl, ref, type) => {
      if (!ref) {
        imgEl.src = WCL.GITHUB_STORE_FALLBACK;
        return;
      }
      const proxyUrl = `${WCL.PHOTO_PROXY_URL}?photo_reference=${encodeURIComponent(ref)}&maxwidth=800`;
      imgEl.src = proxyUrl;
    };

    // ✅ Toast helper
    WCL.toastShared = (msg, cls="success") => {
      const c = document.getElementById("toast-container");
      const t = document.createElement("div");
      t.className = `toast ${cls}`;
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(()=>t.remove(), 3000);
    };

    // ✅ Fallback
    WCL.fallbackForType = () => WCL.GITHUB_STORE_FALLBACK;
  </script>

  <style>
    :root {
      --accent: #007bff;
      --bg: #f9fafb;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --success: #28a745;
      --error: #dc3545;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1.5rem;
    }
    header {
      background: white;
      padding: 0.8rem 1.2rem;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    header h1 { font-size: 1.3rem; margin: 0; }
    header a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .wrap { max-width: 900px; margin: 0 auto; }
    .card { background: #fff; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .full { grid-column: 1 / -1; }
    label { font-weight: 600; display: block; margin-bottom: .3rem; }
    input, select {
      width: 100%; padding: .6rem; border: 1px solid var(--border);
      border-radius: 8px; font-size: 1rem;
    }
    .btn { background: var(--accent); color: #fff; border: none;
      border-radius: 8px; padding: 0.6rem 1.2rem; cursor: pointer; font-weight: 600; }
    .btn:hover { background: #005ec4; }
    .type-group, .access-group { display: flex; gap: .6rem; margin-top: .4rem; }
    .type-btn, .access-pill span {
      border: 1px solid var(--accent); border-radius: 20px; padding: .4rem 1rem;
      font-weight: 600; cursor: pointer; transition: all 0.2s ease;
    }
    .type-btn { background: white; color: var(--accent); }
    .type-btn.active { background: var(--accent); color: white; }
    .access-pill input { display: none; }
    .access-pill span { color: var(--accent); background: white; }
    .access-pill input:checked + span { background: var(--accent); color: white; }
    .stars { display: flex; gap: .3rem; font-size: 1.8rem; cursor: pointer; color: #ccc; }
    .stars span:hover, .stars span:hover ~ span { color: #ffda7a; }
    .stars .sel { color: #ffb400; }
    .photo-picker { display: flex; align-items: center; justify-content: center; gap: .4rem; margin-top: .5rem; }
    .photo-nav { border: 1px solid var(--accent); color: var(--accent); background: white;
      border-radius: 6px; padding: .3rem .6rem; cursor: pointer; }
    .photo-nav:hover { background: #eef5ff; }
    .preview-photo { width: 220px; height: 140px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
    #toast-container { position: fixed; bottom: 1rem; right: 1rem; display: flex; flex-direction: column; gap: .4rem; z-index: 9999; }
    .toast { background: #333; color: #fff; padding: .6rem 1rem; border-radius: 6px; }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--error); }
  </style>
</head>
<body>
  <header>
    <h1>Backoffice — Add Store</h1>
    <a href="backoffice.html">🏠 Home</a>
  </header>

  <div class="wrap">
    <div class="card">
      <div class="grid">
        <div class="full">
          <label>Search with Google</label>
          <input id="gAddress" type="text" placeholder="Start typing a place..." />
          <div class="muted">Select from the list to auto-fill details.</div>
        </div>

        <div><label>Name</label><input id="name" type="text"></div>
        <div><label>Phone</label><input id="phone" type="tel"></div>
        <div class="full"><label>Address</label><input id="addr" type="text"></div>
        <div><label>City</label><input id="city" type="text"></div>
        <div><label>Country</label><input id="country" type="text"></div>
        <div><label>Website</label><input id="website" type="url" placeholder="https://"></div>

        <div class="full">
          <label>Type</label>
          <div class="type-group">
            <button type="button" class="type-btn" data-type="store">Store</button>
            <button type="button" class="type-btn" data-type="lounge">Lounge</button>
          </div>
        </div>

        <div class="full">
          <label>Access</label>
          <div class="access-group">
            <label class="access-pill"><input type="radio" name="access" value="public"><span>Public</span></label>
            <label class="access-pill"><input type="radio" name="access" value="members"><span>Members Only</span></label>
          </div>
        </div>

        <div class="full">
          <label>Rating</label>
          <div id="stars" class="stars">
            <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
          </div>
        </div>

        <div class="full">
          <label>Photo Preview</label>
          <div class="photo-picker">
            <button id="prev-photo" class="photo-nav">◀</button>
            <img id="preview-photo" class="preview-photo" src="https://worldcigarlocator-maker.github.io/Worldcigarlocator/images/store.jpg" alt="Preview" />
            <button id="next-photo" class="photo-nav">▶</button>
          </div>
          <div id="photo-meta" class="muted" style="text-align:center;">No photo loaded</div>
        </div>

        <div class="full" style="display:flex;justify-content:flex-end;gap:.6rem;">
          <button class="btn" onclick="resetForm()">Clear</button>
          <button class="btn" onclick="saveStore()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script>
    const sel = { types: [], access:null, rating:null, place_id:null, _photo_refs:[], photo_index:0, photo_reference:null };

    document.querySelectorAll(".type-btn").forEach(btn=>{
      btn.addEventListener("click",()=>{
        document.querySelectorAll(".type-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        sel.types=[btn.dataset.type];
      });
    });

    document.querySelectorAll(".access-pill input").forEach(r=>{
      r.addEventListener("change",()=>sel.access=r.value);
    });

    const stars=document.getElementById("stars");
    stars.addEventListener("click",e=>{
      const v=+e.target.dataset.v; if(!v)return;
      sel.rating=v;
      [...stars.children].forEach((el,i)=>el.classList.toggle("sel",i<v));
    });

    function resetForm(){
      document.querySelectorAll("input").forEach(i=>{if(i.type!=="radio")i.value="";});
      document.querySelectorAll(".type-btn").forEach(b=>b.classList.remove("active"));
      document.querySelectorAll(".access-pill input").forEach(r=>r.checked=false);
      sel.types=[]; sel.access=null; sel.rating=null; sel.place_id=null; sel._photo_refs=[]; sel.photo_reference=null;
      document.getElementById("preview-photo").src=WCL.GITHUB_STORE_FALLBACK;
      document.getElementById("photo-meta").textContent="No photo loaded";
      WCL.toastShared("Cleared","success");
    }

    async function saveStore(){
      const name=document.getElementById("name").value.trim();
      const address=document.getElementById("addr").value.trim();
      const city=document.getElementById("city").value.trim();
      const country=document.getElementById("country").value.trim();
      if(!name||!address||!city||!country){WCL.toastShared("Please fill in required fields","error");return;}

      const continent = WCL.countryToContinent(country);
      const payload={name,address,city,country,continent,
        type:sel.types[0]||null,types:sel.types,access:sel.access,rating:sel.rating??null,
        place_id:sel.place_id,photo_reference:sel.photo_reference||null,photo_url:null,
        approved:false,flagged:false,deleted:false,status:"pending"};
      const { error } = await WCL.supabase.from("stores").insert([payload]);
      if(error){console.error(error);WCL.toastShared("Error saving","error");return;}
      WCL.toastShared("Store saved successfully","success");
      resetForm();
    }

    async function initAutocomplete() {
      const input = document.getElementById("gAddress");
      const ac = new google.maps.places.Autocomplete(input, {
        fields: ["place_id","address_components","geometry","name","formatted_address","international_phone_number","website"]
      });

      ac.addListener("place_changed", async () => {
        const p = ac.getPlace(); if (!p) return;
        document.getElementById("name").value = p.name || "";
        document.getElementById("addr").value = p.formatted_address || "";
        document.getElementById("phone").value = p.international_phone_number || "";
        document.getElementById("website").value = p.website || "";
        const comps = p.address_components || [];
        const city = comps.find(c => c.types.includes("locality") || c.types.includes("postal_town"));
        const country = comps.find(c => c.types.includes("country"));
        document.getElementById("city").value = city?.long_name || "";
        document.getElementById("country").value = country?.long_name || "";
        sel.place_id = p.place_id || null;
        const refs = await WCL.fetchPhotoRefs(sel.place_id);
        if (refs.length > 0) {
          sel._photo_refs = refs; sel.photo_index = 0; sel.photo_reference = refs[0];
          await WCL.loadProxyPhotoInto(document.getElementById("preview-photo"), refs[0]);
          document.getElementById("photo-meta").textContent = `Loaded ${refs.length} photo(s)`;
        } else {
          document.getElementById("preview-photo").src = WCL.fallbackForType(sel.types[0]);
          document.getElementById("photo-meta").textContent = "No Google photos found";
        }
      });

      document.getElementById("prev-photo").onclick = () => {
        if (sel._photo_refs.length > 0) {
          sel.photo_index = (sel.photo_index - 1 + sel._photo_refs.length) % sel._photo_refs.length;
          WCL.loadProxyPhotoInto(document.getElementById("preview-photo"), sel._photo_refs[sel.photo_index]);
        }
      };
      document.getElementById("next-photo").onclick = () => {
        if (sel._photo_refs.length > 0) {
          sel.photo_index = (sel.photo_index + 1) % sel._photo_refs.length;
          WCL.loadProxyPhotoInto(document.getElementById("preview-photo"), sel._photo_refs[sel.photo_index]);
        }
      };
    }
    window.initAutocomplete = initAutocomplete;
  </script>

  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDdn7E6_dfwUjGQ1IUdJ2rQXUeEYIIzVtQ&libraries=places&callback=initAutocomplete"></script>
</body>
</html>
