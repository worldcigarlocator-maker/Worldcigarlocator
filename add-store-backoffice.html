<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backoffice — Add Store</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --blue: #007bff;
      --gold: #ffc107;
      --border: #ddd;
      --bg: #f7f9fb;
      --text: #222;
      --muted: #777;
      --shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1rem;
    }
    .wrap { max-width: 900px; margin: auto; background: #fff; padding: 1.5rem; border-radius: 10px; box-shadow: var(--shadow); }

    label { font-weight: 600; display: block; margin-bottom: .3rem; }
    input, select {
      width: 100%; padding: .45rem .6rem; border: 1px solid var(--border);
      border-radius: 6px; font-size: .9rem; margin-bottom: .8rem;
    }

    .type-group { display: flex; gap: .6rem; margin-bottom: .8rem; }
    .type-btn {
      padding: .4rem .9rem; border: 1px solid var(--border); border-radius: 6px;
      cursor: pointer; background: #fff; font-weight: 600; transition: .2s;
    }
    .type-btn:hover { background: #f1f1f1; }
    .type-btn.active[data-type="store"] { background: var(--blue); color: #fff; border-color: var(--blue); }
    .type-btn.active[data-type="lounge"] { background: var(--gold); color: #000; border-color: var(--gold); }

    .preview img { max-width: 240px; border-radius: 8px; box-shadow: var(--shadow); }

    .btn {
      background: var(--blue); color: #fff; border: none; border-radius: 6px;
      padding: .6rem 1.2rem; font-weight: 600; cursor: pointer; font-size: .9rem;
    }
    .btn:hover { background: #005ec4; }
    #toast-container { position: fixed; bottom: 1rem; right: 1rem; display: flex; flex-direction: column; gap: .3rem; }
    .toast { background: #333; color: #fff; padding: .4rem .8rem; border-radius: 6px; }
    .toast.success { background: #28a745; }
    .toast.error { background: #dc3545; }
  </style>

  <script>
    const WCL = {
      SUPABASE_URL: "https://gbxxoeplkzbhsvagnfsr.supabase.co",
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdieHhvZXBsa3piaHN2YWduZnNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2NjQ1MDAsImV4cCI6MjA3MzI0MDUwMH0.E4Vk-GyLe22vyyfRy05hZtf4t5w_Bd_B-tkEFZ1alT4",
      PHOTO_PROXY_URL: "https://gbxxoeplkzbhsvagnfsr.functions.supabase.co/photo-proxy",
      PHOTO_REFS_URL: "https://gbxxoeplkzbhsvagnfsr.functions.supabase.co/photo-refs",
      FALLBACK_IMG: "https://worldcigarlocator-maker.github.io/Worldcigarlocator/images/store.jpg"
    };
    WCL.supabase = window.supabase.createClient(WCL.SUPABASE_URL, WCL.SUPABASE_ANON_KEY);
    WCL.toast = (msg, cls="success") => {
      const c = document.getElementById("toast-container");
      const t = document.createElement("div");
      t.className = `toast ${cls}`;
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(()=>t.remove(), 2500);
    };
    WCL.fetchPhotoRefs = async (placeId) => {
      try {
        const res = await fetch(`${WCL.PHOTO_REFS_URL}?place_id=${placeId}`);
        const json = await res.json();
        return json.refs || [];
      } catch { return []; }
    };
    WCL.buildPhotoProxyUrl = (ref) => `${WCL.PHOTO_PROXY_URL}?photo_reference=${encodeURIComponent(ref)}&maxwidth=800`;
    WCL.countryToContinent = (countryIso2) => {
      const c = (countryIso2 || "").toLowerCase();
      if (["se","de","fr","it","es","no","fi","dk","nl","be","pl","ch","pt"].includes(c)) return "Europe";
      if (["us","ca","mx"].includes(c)) return "North America";
      if (["br","ar","cl","pe","co"].includes(c)) return "South America";
      if (["cn","jp","in","th","sg"].includes(c)) return "Asia";
      if (["za","ng","eg","ma","gh"].includes(c)) return "Africa";
      if (["au","nz"].includes(c)) return "Oceania";
      return "Other";
    };
  </script>
</head>
<body>
  <div class="wrap">
    <h2>Add Store</h2>

    <form id="addStoreForm">
      <label for="autocomplete">Search Google Place</label>
      <input id="autocomplete" type="text" placeholder="Start typing store name or address..." />

      <label>Name</label>
      <input id="name" type="text" required>

      <label>Address</label>
      <input id="address" type="text">

      <label>City</label>
      <input id="city" type="text">

      <label>Country</label>
      <input id="country" type="text">

      <label>Phone</label>
      <input id="phone" type="text">

      <label>Website</label>
      <input id="website" type="url">

      <label>Type</label>
      <div class="type-group">
        <button type="button" class="type-btn" data-type="store">🏪 Store</button>
        <button type="button" class="type-btn" data-type="lounge">🍷 Lounge</button>
      </div>

      <label>Rating</label>
      <input id="rating" type="number" min="0" max="5" step="0.1">

      <label>Added by</label>
      <input id="added_by" type="text" placeholder="Your name">

      <label>Photo Preview</label>
      <div class="preview" id="preview">
        <img src="https://worldcigarlocator-maker.github.io/Worldcigarlocator/images/store.jpg" alt="Preview">
      </div>

      <br>
      <button id="saveBtn" class="btn">Save Store</button>
    </form>
  </div>

  <div id="toast-container"></div>

  <script>
    window.selectedPlace = {};
    let selectedTypes = [];

    // 🔹 Type buttons
    document.querySelectorAll(".type-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const type = btn.dataset.type;
        if (selectedTypes.includes(type)) {
          selectedTypes = selectedTypes.filter(t => t !== type);
          btn.classList.remove("active");
        } else {
          selectedTypes.push(type);
          btn.classList.add("active");
        }
      });
    });

    // 🔹 Google autocomplete
    window.initAutocomplete = async function() {
      const input = document.getElementById("autocomplete");
      const ac = new google.maps.places.Autocomplete(input, {
        fields: ["place_id","geometry","formatted_address","name","address_components","international_phone_number","website","photos"],
        language: "en"
      });

      ac.addListener("place_changed", async () => {
        const place = ac.getPlace();
        if (!place.place_id) return;
        window.selectedPlace = {
          name: place.name || "",
          address: place.formatted_address || "",
          place_id: place.place_id,
          lat: place.geometry?.location?.lat() || null,
          lng: place.geometry?.location?.lng() || null
        };

        const comp = place.address_components || [];
        const cityObj = comp.find(c=>c.types.includes("locality")||c.types.includes("postal_town"));
        const countryObj = comp.find(c=>c.types.includes("country"));
        const countryIso2 = countryObj?.short_name?.toLowerCase() || "";
        window.selectedPlace.city = cityObj?.long_name || "";
        window.selectedPlace.country = countryObj?.long_name || "";
        window.selectedPlace.country_iso2 = countryIso2;
        window.selectedPlace.continent = WCL.countryToContinent(countryIso2);

        document.getElementById("name").value = window.selectedPlace.name;
        document.getElementById("address").value = window.selectedPlace.address;
        document.getElementById("city").value = window.selectedPlace.city;
        document.getElementById("country").value = window.selectedPlace.country;

        const refs = await WCL.fetchPhotoRefs(place.place_id);
        if (refs.length) {
          window.selectedPlace.photo_reference = refs[0];
          document.querySelector("#preview img").src = WCL.buildPhotoProxyUrl(refs[0]);
        } else {
          document.querySelector("#preview img").src = WCL.FALLBACK_IMG;
        }

        document.getElementById("phone").value = place.international_phone_number || "";
        document.getElementById("website").value = place.website || "";
        WCL.toast("✅ Place loaded", "success");
      });
    };

    // 🔹 Save
    document.getElementById("addStoreForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      document.getElementById("saveBtn").disabled = true;

      try {
        const types = selectedTypes.length ? selectedTypes : ["store"];
        const rating = Number(document.getElementById("rating").value || 0);
        const added_by = document.getElementById("added_by").value || "anonymous";

        const payload = {
          ...window.selectedPlace,
          types,
          rating,
          added_by,
          approved: false,
          flagged: false,
          deleted: false,
          phone: document.getElementById("phone").value || null,
          website: document.getElementById("website").value || null,
          continent: window.selectedPlace.continent,
          country_iso2: window.selectedPlace.country_iso2 || null,
        };

        console.log("📦 Saving payload →", payload);
        const { error } = await WCL.supabase.from("stores").insert([payload]);
        if (error) throw error;

        WCL.toast("✅ Store added successfully!", "success");
        e.target.reset();
        document.querySelector("#preview img").src = WCL.FALLBACK_IMG;
        selectedTypes = [];
        document.querySelectorAll(".type-btn").forEach(b=>b.classList.remove("active"));
      } catch (err) {
        console.error(err);
        WCL.toast("❌ Error saving store", "error");
      } finally {
        document.getElementById("saveBtn").disabled = false;
      }
    });
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDdn7E6_dfwUjGQ1IUdJ2rQXUeEYIIzVtQ&libraries=places&callback=initAutocomplete&language=en"
    async defer>
  </script>
</body>
</html>
