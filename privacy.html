<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Privacy Policy — World Cigar Locator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
<link rel="stylesheet" href="css/core/variables.css">
<link rel="stylesheet" href="css/start.css">
</head>

<body class="static-page">

  <!-- ================= STATIC PAGE TOPBAR ================= -->
<header class="page-topbar">

  <a href="index.html" class="page-brand">
    World Cigar Locator
  </a>

  <nav class="page-nav">
    <a href="about.html">About</a>
    <a href="report.html">Report</a>
    <a href="legal.html">Legal</a>
    <a href="privacy.html" class="active">Privacy</a>
  </nav>

</header>

 <!-- ================= PAGE CONTENT ================= -->

<main class="legal-page">

  <div
    id="privacyContent"
    class="legal-inner"
  >
    Loading...
  </div>

</main>
<script type="module">

import {
  getLanguage
} from "/js/i18n.js";

async function loadPrivacyPage() {

  const lang =
    await getLanguage();

  const container =
    document.getElementById(
      "privacyContent"
    );

  if (!container) return;

  try {

    const response =
      await fetch(
        `/locales/pages/privacy/${lang}.html`
      );

    if (!response.ok) {
      throw new Error(
        "Locale not found"
      );
    }

    container.innerHTML =
      await response.text();

  } catch (err) {

    console.error(
      "PRIVACY LOAD ERROR",
      err
    );

    const fallback =
      await fetch(
        "/locales/pages/privacy/en.html"
      );

    container.innerHTML =
      await fallback.text();

  }

}

loadPrivacyPage();

</script>
</body>
</html>
