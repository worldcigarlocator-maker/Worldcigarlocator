<main class="main">

  <div class="top-status">
  <div class="online-box">
    <span id="onlineCircle" class="online-circle"></span>
    <span id="onlineCount" class="online-text">Online: 87</span>
  </div>

  <div class="auth-mini">
    <button id="miniLogin" class="mini-btn">Login</button>
    <button id="miniLogout" class="mini-btn" style="display:none;">Logout</button>
  </div>
</div>


  <!-- TOP STATUS ROW -->
  <div class="status-row">

    <div class="online-box">
      <span class="dot"></span>
      <span id="onlineCount">Online: 0</span>
    </div>

    <div class="auth-buttons">
      <button id="loginBtn" class="login-btn">Login</button>
      <button id="logoutBtn" class="logout-btn" style="display:none;">Logout</button>
    </div>

  </div>

  <!-- Search -->
  <div class="searchbar">
    <input
      id="searchInput"
      type="text"
      placeholder="Search by name, city or country…"
    />
  </div>

  <!-- Cards grid -->
  <div id="storeGrid" class="store-grid"></div>
  <div id="toast-container"></div>

</main>
